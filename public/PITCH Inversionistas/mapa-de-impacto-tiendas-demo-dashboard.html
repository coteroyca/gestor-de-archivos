<!DOCTYPE html>
<html lang="es">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Impacto · RetailMind 360°</title>
    <!-- Fuentes Luxury: Cinzel y Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js para gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <style>
        /* ===== RESET Y BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --hulk: #008744;
            --hulk-vibrant: #00E676;
            --hulk-dark: #002B15;
            --hulk-glow: rgba(0, 230, 118, 0.25);
            --abyssal: #050B08;
            --surface: #0B1612;
            --surface-card: #0F1F1A;
            --border-deep: rgba(212, 175, 55, 0.25);
            --border-glow: rgba(212, 175, 55, 0.4);
            --rolex-gold: #D4AF37;
            --rolex-gold-light: #F3E5AB;
            --steel-light: #F1F5F9;
            --steel-muted: #7E998F;
            --steel-silver: #CBD5E1;
            --red: #FF4D4D;
            --gold: #D4AF37;
            --blue-accent: #29B6F6;
            --purple: #AB47BC;
        }

        body {
            background: var(--abyssal);
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 135, 68, 0.15) 0%, transparent 75%),
                radial-gradient(circle at 85% 30%, rgba(212, 175, 55, 0.05) 0%, transparent 50%);
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--steel-light);
            min-height: 100vh;
            font-size: 13px;
            line-height: 1.5;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--abyssal);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--hulk), var(--rolex-gold));
            border-radius: 20px;
        }

        /* ===== SHELL ===== */
        .shell {
            display: grid;
            grid-template-rows: 56px 1fr;
            grid-template-columns: 230px 1fr;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== TOPBAR ===== */
        .topbar {
            grid-column: 1/-1;
            background: rgba(11, 22, 18, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-deep);
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            gap: 1rem;
            position: relative;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .topbar img {
            height: 28px;
            filter: drop-shadow(0 0 8px rgba(0, 230, 118, 0.3));
        }
        .topbar-divider {
            width: 1px;
            height: 24px;
            background: linear-gradient(180deg, transparent, var(--rolex-gold), transparent);
            margin: 0 0.5rem;
            opacity: 0.5;
        }
        .topbar-date {
            font-size: 11px;
            color: var(--steel-muted);
            letter-spacing: 0.5px;
        }
        .topbar-badge {
            background: linear-gradient(135deg, rgba(0, 135, 68, 0.3), rgba(212, 175, 55, 0.15));
            color: var(--rolex-gold-light);
            padding: 3px 14px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            border: 1px solid var(--rolex-gold);
            margin-left: auto;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }
        .topbar-user {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 1rem;
        }
        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--rolex-gold), var(--hulk));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 800;
            color: #000;
            border: 1px solid var(--rolex-gold-light);
            box-shadow: 0 0 8px var(--hulk-glow);
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            background: var(--surface);
            border-right: 1px solid var(--border-deep);
            padding: 1rem 0;
            overflow-y: auto;
        }
        .sidebar-section {
            padding: 0.5rem 1.2rem;
            font-size: 10px;
            font-weight: 700;
            color: var(--rolex-gold);
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-top: 0.5rem;
            font-family: 'Cinzel', serif;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 1.2rem;
            cursor: pointer;
            color: var(--steel-muted);
            font-size: 12px;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }
        .nav-item:hover {
            color: var(--steel-light);
            background: rgba(0, 230, 118, 0.05);
            border-left-color: var(--rolex-gold);
        }
        .nav-item.active {
            color: #fff;
            border-left-color: var(--rolex-gold);
            background: linear-gradient(90deg, rgba(0, 135, 68, 0.25) 0%, transparent 100%);
            font-weight: 600;
        }
        .nav-icon {
            font-size: 14px;
            width: 18px;
            text-align: center;
        }

        /* ===== MAIN ===== */
        .main {
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            background: transparent;
        }

        /* ===== BREADCRUMB ===== */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--steel-muted);
        }
        .breadcrumb span {
            cursor: pointer;
            transition: color 0.15s;
        }
        .breadcrumb span:hover {
            color: var(--rolex-gold);
        }
        .breadcrumb .active-crumb {
            color: var(--steel-light);
            font-weight: 600;
        }

        /* ===== DRILL TABS ===== */
        .drill-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .drill-tab {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid var(--border-deep);
            color: var(--steel-muted);
            background: rgba(15, 31, 26, 0.6);
        }
        .drill-tab:hover {
            color: var(--steel-light);
            border-color: var(--hulk);
            background: rgba(0, 135, 68, 0.15);
        }
        .drill-tab.active {
            background: linear-gradient(135deg, var(--hulk), var(--hulk-dark));
            border-color: var(--rolex-gold);
            color: #fff;
            box-shadow: 0 0 12px var(--hulk-glow);
        }

        /* ===== KPI CARD ===== */
        .kpi-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .kpi {
            background: linear-gradient(145deg, var(--surface-card), var(--surface));
            border: 1px solid var(--border-deep);
            border-radius: 12px;
            padding: 1.1rem 1.2rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .kpi::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--rolex-gold), transparent);
            opacity: 0.5;
        }
        .kpi:hover {
            border-color: var(--rolex-gold);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.15);
        }
        .kpi-label {
            font-size: 10px;
            color: var(--steel-muted);
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Cinzel', serif;
        }
        .kpi-value {
            font-size: 26px;
            font-weight: 700;
            margin: 6px 0 2px;
            color: #fff;
            font-family: 'Cinzel', serif;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }
        .kpi-delta {
            font-size: 11px;
            font-weight: 600;
        }
        .kpi-spark {
            margin-top: 8px;
            height: 24px;
            display: flex;
            align-items: flex-end;
        }
        .kpi-spark svg {
            width: 100%;
            height: 100%;
        }
        .up {
            color: var(--hulk-vibrant);
            text-shadow: 0 0 6px rgba(0, 230, 118, 0.3);
        }
        .down {
            color: var(--red);
        }
        .flat {
            color: var(--rolex-gold);
        }

        /* ===== STATE GRID ===== */
        .state-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .state-card {
            background: linear-gradient(145deg, var(--surface-card), var(--surface));
            border: 1px solid var(--border-deep);
            border-radius: 14px;
            padding: 1.2rem;
            transition: all 0.25s ease;
        }
        .state-card:hover {
            border-color: var(--rolex-gold);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 15px rgba(212, 175, 55, 0.2);
        }
        .sc-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .sc-domain {
            font-size: 10px;
            font-weight: 700;
            color: var(--rolex-gold);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Cinzel', serif;
        }
        .sc-status {
            font-size: 9px;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .s-green {
            background: rgba(0, 230, 118, 0.12);
            color: var(--hulk-vibrant);
            border: 1px solid rgba(0, 230, 118, 0.3);
        }
        .s-red {
            background: rgba(239, 68, 68, 0.12);
            color: var(--red);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .s-yellow {
            background: rgba(212, 175, 55, 0.12);
            color: var(--rolex-gold);
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        .s-blue {
            background: rgba(41, 182, 246, 0.12);
            color: var(--blue-accent);
            border: 1px solid rgba(41, 182, 246, 0.3);
        }
        .s-purple {
            background: rgba(171, 71, 188, 0.12);
            color: var(--purple);
            border: 1px solid rgba(171, 71, 188, 0.3);
        }
        .sc-state {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
        }
        .sc-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 4px 0;
            font-size: 11px;
            color: var(--steel-muted);
        }
        .sc-row strong {
            color: var(--steel-light);
            font-weight: 600;
        }

        /* ===== PANELS ===== */
        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .panel {
            background: linear-gradient(145deg, var(--surface-card), var(--surface));
            border: 1px solid var(--border-deep);
            border-radius: 14px;
            padding: 1.2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .panel-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--rolex-gold);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 14px;
            font-family: 'Cinzel', serif;
        }

        /* ===== HIERARCHY LIST ===== */
        .hier-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-deep);
            transition: all 0.2s ease;
        }
        .hier-item:last-child {
            border-bottom: none;
        }
        .hier-item:hover {
            padding-left: 6px;
        }
        .hier-item:hover .hi-name {
            color: var(--hulk-vibrant);
        }
        .hi-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 6px currentColor;
        }
        .hi-name {
            font-size: 12px;
            font-weight: 500;
            flex: 1;
            color: var(--steel-light);
        }
        .hi-state {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 8px;
            font-weight: 700;
        }
        .hi-delta {
            font-size: 11px;
            font-weight: 600;
            min-width: 50px;
            text-align: right;
        }
        .hi-arrow {
            color: var(--rolex-gold);
            font-size: 14px;
        }

        /* ===== NARRATIVE BOX ===== */
        .narrative-box {
            background: linear-gradient(135deg, rgba(0, 135, 68, 0.12) 0%, rgba(15, 31, 26, 0.8) 100%);
            border: 1px solid var(--border-glow);
            border-left: 4px solid var(--rolex-gold);
            border-radius: 14px;
            padding: 1.2rem;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.4);
        }
        .narr-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .narr-icon {
            font-size: 16px;
        }
        .narr-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--rolex-gold);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Cinzel', serif;
        }
        .narr-text {
            font-size: 12px;
            color: var(--steel-silver);
            line-height: 1.7;
        }
        .narr-text strong {
            color: #fff;
            font-weight: 600;
        }

        /* ===== CHART WRAP ===== */
        .chart-wrap {
            position: relative;
            height: 200px;
            margin-top: 8px;
        }

        /* ===== MATRIX TABLE ===== */
        .matrix-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-top: 8px;
        }
        .matrix-table th,
        .matrix-table td {
            padding: 10px 12px;
            text-align: center;
            border: 1px solid var(--border-deep);
        }
        .matrix-table th {
            background: var(--surface);
            color: var(--rolex-gold);
            font-family: 'Cinzel', serif;
            letter-spacing: 0.5px;
            font-size: 10px;
        }
        .matrix-table td {
            color: var(--steel-silver);
        }
        .matrix-table .joya {
            background: rgba(0, 230, 118, 0.15);
            color: var(--hulk-vibrant);
            font-weight: 700;
        }
        .matrix-table .apuesta {
            background: rgba(212, 175, 55, 0.15);
            color: var(--rolex-gold);
            font-weight: 700;
        }
        .matrix-table .bunker {
            background: rgba(255, 165, 0, 0.15);
            color: #FFA500;
            font-weight: 700;
        }
        .matrix-table .lastre {
            background: rgba(255, 77, 77, 0.15);
            color: var(--red);
            font-weight: 700;
        }
        .matrix-table .sparkline-cell {
            width: 80px;
            padding: 4px 8px;
        }

        /* ===== TREND BADGE ===== */
        .trend-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
        }
        .trend-badge.up {
            background: rgba(0, 230, 118, 0.15);
            color: var(--hulk-vibrant);
            border: 1px solid rgba(0, 230, 118, 0.3);
        }
        .trend-badge.down {
            background: rgba(239, 68, 68, 0.15);
            color: var(--red);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .trend-badge.flat {
            background: rgba(212, 175, 55, 0.15);
            color: var(--rolex-gold);
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        /* ===== MAPA DE BURBUJAS SVG ===== */
        .map-container {
            background: var(--abyssal);
            border-radius: 12px;
            border: 1px solid var(--border-deep);
            padding: 8px;
            position: relative;
            overflow: hidden;
        }
        .map-container svg {
            width: 100%;
            height: auto;
            display: block;
        }
        .map-bubble {
            transition: r 0.2s ease;
            cursor: pointer;
        }
        .map-bubble:hover {
            filter: drop-shadow(0 0 8px currentColor);
        }
        .map-label {
            font-size: 7px;
            fill: var(--steel-light);
            font-weight: 600;
            text-anchor: middle;
            pointer-events: none;
        }
        .map-legend {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 6px;
        }
        .map-legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 9px;
            color: var(--steel-muted);
        }
        .map-legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* ===== DONUT CHART WRAP ===== */
        .donut-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
        }
        .donut-container {
            width: 160px;
            height: 160px;
            position: relative;
        }
        .donut-container canvas {
            width: 100% !important;
            height: 100% !important;
        }
        .donut-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
        }
        .donut-center .total {
            font-size: 28px;
            font-weight: 800;
            font-family: 'Cinzel', serif;
            color: #fff;
            line-height: 1;
        }
        .donut-center .label {
            font-size: 9px;
            color: var(--steel-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .donut-legend {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .donut-legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: var(--steel-silver);
        }
        .donut-legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 720px) {
            .shell {
                grid-template-columns: 1fr;
                grid-template-rows: 56px 1fr;
            }
            .topbar {
                padding: 0 0.75rem;
                gap: 0.6rem;
            }
            .topbar img {
                height: 22px;
                max-width: 130px;
                object-fit: contain;
            }
            .topbar-badge,
            .topbar-user,
            .topbar-date {
                display: none;
            }
            .sidebar {
                display: none;
            }
            .main {
                grid-column: 1;
                padding: 1rem;
                gap: 1rem;
            }
            .kpi-row {
                grid-template-columns: repeat(2, 1fr);
            }
            .state-grid,
            .two-col {
                grid-template-columns: 1fr;
            }
            .donut-wrap {
                flex-direction: column;
                align-items: center;
            }
            .donut-legend {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
            }
            .map-container svg {
                height: 180px;
            }
        }
    </style>
</head>
<body>
    <div class="shell">

        <!-- TOPBAR -->
        <div class="topbar">
            <img src="https://gestor-de-archivos.vercel.app/assets/logos/logo-retailmind-hulk-transparente.png" alt="RetailMind 360°" style="height:32px;">
            <div class="topbar-divider"></div>
            <span style="font-size:11px;color:var(--steel-muted);letter-spacing:0.5px;">Mapa de Impacto · Demo</span>
            <span class="topbar-badge">8 Dashboards + Histórico</span>
            <div class="topbar-divider"></div>
            <span class="topbar-date" id="dateLabel">lunes, 31 de agosto de 2026</span>
            <div class="topbar-user" style="margin-left:auto">
                <span style="font-size:11px;color:var(--steel-muted)">Demo Interactiva</span>
                <div class="avatar">RM</div>
            </div>
        </div>

        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-section">Navegación</div>
            <div class="nav-item active" onclick="cambiarVista('diagnostico')"><span class="nav-icon">📊</span> Diagnóstico 4×3</div>
            <div class="nav-item" onclick="cambiarVista('riesgo')"><span class="nav-icon">🗺️</span> Mapa de Riesgo</div>
            <div class="nav-item" onclick="cambiarVista('eficiencia')"><span class="nav-icon">🏆</span> Top/Bottom Performers</div>
            <div class="nav-item" onclick="cambiarVista('brecha')"><span class="nav-icon">📈</span> Análisis de Brecha</div>
            <div class="nav-item" onclick="cambiarVista('simulacion')"><span class="nav-icon">⚙️</span> Simulación de Pesos</div>
            <div class="nav-item" onclick="cambiarVista('accion')"><span class="nav-icon">📋</span> Plan de Acción</div>
            <div class="nav-item" onclick="cambiarVista('escenarios')"><span class="nav-icon">📌</span> Matriz de Escenarios</div>
            <div class="nav-item" onclick="cambiarVista('historico')"><span class="nav-icon">📈</span> Evolución Histórica</div>
            <div class="sidebar-section" style="margin-top:auto;">Sistema</div>
            <div class="nav-item"><span class="nav-icon">⚙️</span> Configuración</div>
        </div>

        <!-- MAIN -->
        <div class="main" id="mainContent">
            <!-- Contenido inyectado por JS -->
        </div>
    </div>

    <script>
        // ================================================================
        // DATOS DE EJEMPLO (10 tiendas) + HISTÓRICO (6 meses)
        // ================================================================
        const meses = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun'];

        // Datos base por tienda (valores actuales)
        const tiendasBase = [
            { nombre: 'Plaza Norte', ciudad: 'Caracas', lat: 10.5, lng: -66.9, salud: 2.8, resiliencia: 2.9, potencial: 2.9,
                exposicion: 2.7, tipo: 'JOYA' },
            { nombre: 'Plaza Centro', ciudad: 'Caracas', lat: 10.48, lng: -66.92, salud: 2.7, resiliencia: 2.7, potencial: 2.8,
                exposicion: 2.6, tipo: 'JOYA' },
            { nombre: 'Plaza Este', ciudad: 'Caracas', lat: 10.52, lng: -66.85, salud: 2.5, resiliencia: 2.6, potencial: 2.8,
                exposicion: 2.5, tipo: 'JOYA' },
            { nombre: 'Plaza Oeste', ciudad: 'Caracas', lat: 10.46, lng: -66.95, salud: 2.6, resiliencia: 2.8, potencial: 2.7,
                exposicion: 2.8, tipo: 'JOYA' },
            { nombre: 'Plaza Sur', ciudad: 'Caracas', lat: 10.44, lng: -66.88, salud: 2.8, resiliencia: 2.7, potencial: 2.9,
                exposicion: 2.4, tipo: 'JOYA' },
            { nombre: 'Plaza Maracaibo', ciudad: 'Maracaibo', lat: 10.65, lng: -71.61, salud: 1.2, resiliencia: 1.0,
                potencial: 3.0, exposicion: 1.3, tipo: 'APUESTA' },
            { nombre: 'Plaza Valencia', ciudad: 'Valencia', lat: 10.18, lng: -68.00, salud: 1.0, resiliencia: 1.0,
                potencial: 2.7, exposicion: 1.3, tipo: 'APUESTA' },
            { nombre: 'Plaza Barquisimeto', ciudad: 'Barquisimeto', lat: 10.08, lng: -69.32, salud: 2.0, resiliencia: 3.0,
                potencial: 1.3, exposicion: 2.0, tipo: 'BUNKER' },
            { nombre: 'Plaza Maturín', ciudad: 'Maturín', lat: 9.75, lng: -63.18, salud: 2.0, resiliencia: 3.0, potencial: 1.0,
                exposicion: 2.0, tipo: 'BUNKER' },
            { nombre: 'Plaza San Cristóbal', ciudad: 'San Cristóbal', lat: 7.77, lng: -72.22, salud: 1.0, resiliencia: 1.0,
                potencial: 1.0, exposicion: 3.0, tipo: 'LASTRE' }
        ];

        // Generar histórico de 6 meses para cada tienda
        function generarHistorico(tienda, meses) {
            const historico = [];
            const seed = tienda.nombre.length * 7 + tienda.salud * 3;
            let valSalud = tienda.salud - 0.6 + (seed % 5) * 0.1;
            let valResiliencia = tienda.resiliencia - 0.5 + (seed % 7) * 0.08;
            let valPotencial = tienda.potencial - 0.4 + (seed % 6) * 0.09;
            let valExposicion = tienda.exposicion - 0.3 + (seed % 8) * 0.07;

            for (let i = 0; i < meses.length; i++) {
                const trend = i / meses.length * 0.4;
                const noise = (Math.sin(i * 0.8 + seed) * 0.15) + (Math.random() * 0.1 - 0.05);
                valSalud = Math.max(0.5, Math.min(3.0, valSalud + 0.04 * trend + noise * 0.3));
                valResiliencia = Math.max(0.5, Math.min(3.0, valResiliencia + 0.03 * trend + noise * 0.25));
                valPotencial = Math.max(0.5, Math.min(3.0, valPotencial + 0.05 * trend + noise * 0.35));
                valExposicion = Math.max(0.5, Math.min(3.0, valExposicion + 0.02 * trend + noise * 0.2));
                historico.push({
                    mes: meses[i],
                    salud: parseFloat(valSalud.toFixed(2)),
                    resiliencia: parseFloat(valResiliencia.toFixed(2)),
                    potencial: parseFloat(valPotencial.toFixed(2)),
                    exposicion: parseFloat(valExposicion.toFixed(2))
                });
            }
            return historico;
        }

        // Construir dataset completo
        const tiendas = tiendasBase.map(t => {
            const historico = generarHistorico(t, meses);
            const ultimo = historico[historico.length - 1];
            return {
                ...t,
                historico: historico,
                salud: ultimo.salud,
                resiliencia: ultimo.resiliencia,
                potencial: ultimo.potencial,
                exposicion: ultimo.exposicion
            };
        });

        // Recalcular tipo
        tiendas.forEach(t => {
            if (t.resiliencia >= 2.5 && t.potencial >= 2.5) t.tipo = 'JOYA';
            else if (t.resiliencia < 2.5 && t.potencial >= 2.5) t.tipo = 'APUESTA';
            else if (t.resiliencia >= 2.5 && t.potencial < 2.5) t.tipo = 'BUNKER';
            else t.tipo = 'LASTRE';
        });

        // ================================================================
        // CONTADORES POR TIPO (con histórico para sparklines)
        // ================================================================
        function contarTipos() {
            const counts = { JOYA: 0, APUESTA: 0, BUNKER: 0, LASTRE: 0 };
            tiendas.forEach(t => counts[t.tipo]++);
            return counts;
        }

        function contarTiposHistorico() {
            // Para cada mes, contar cuántas tiendas de cada tipo
            const result = {};
            meses.forEach((mes, idx) => {
                const counts = { JOYA: 0, APUESTA: 0, BUNKER: 0, LASTRE: 0 };
                tiendas.forEach(t => {
                    // Determinar tipo basado en los valores históricos de ese mes
                    const h = t.historico[idx];
                    let tipo = '';
                    if (h.resiliencia >= 2.5 && h.potencial >= 2.5) tipo = 'JOYA';
                    else if (h.resiliencia < 2.5 && h.potencial >= 2.5) tipo = 'APUESTA';
                    else if (h.resiliencia >= 2.5 && h.potencial < 2.5) tipo = 'BUNKER';
                    else tipo = 'LASTRE';
                    counts[tipo]++;
                });
                result[mes] = counts;
            });
            return result;
        }

        // ================================================================
        // CALCULAR TENDENCIA
        // ================================================================
        function calcularTendencia(historico, key) {
            const valores = historico.map(h => h[key]);
            if (valores.length < 2) return { direccion: 'flat', delta: 0, pct: 0 };
            const primero = valores[0];
            const ultimo = valores[valores.length - 1];
            const delta = ultimo - primero;
            const pct = primero !== 0 ? (delta / Math.abs(primero)) * 100 : 0;
            let direccion = 'flat';
            if (delta > 0.08) direccion = 'up';
            else if (delta < -0.08) direccion = 'down';
            return { direccion, delta, pct };
        }

        // ================================================================
        // GENERAR SPARKLINE SVG
        // ================================================================
        function sparklineSVG(valores, color, height = 24, width = 60) {
            if (!valores || valores.length < 2) return '';
            const min = Math.min(...valores);
            const max = Math.max(...valores);
            const range = (max - min) || 1;
            const pad = 2;
            const puntos = valores.map((v, i) => {
                const x = (i / (valores.length - 1)) * (width - pad * 2) + pad;
                const y = height - pad - ((v - min) / range) * (height - pad * 2);
                return `${x.toFixed(1)},${y.toFixed(1)}`;
            }).join(' ');
            return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" style="display:inline-block;vertical-align:middle;">
                        <polyline points="${puntos}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <polygon points="${puntos}" fill="${color}10" opacity="0.3"/>
                    </svg>`;
        }

        // ================================================================
        // COLORES POR TIPO
        // ================================================================
        function colorTipo(tipo) {
            switch (tipo) {
                case 'JOYA':
                    return 'var(--hulk-vibrant)';
                case 'APUESTA':
                    return 'var(--rolex-gold)';
                case 'BUNKER':
                    return '#FFA500';
                case 'LASTRE':
                    return 'var(--red)';
                default:
                    return 'var(--steel-muted)';
            }
        }

        function colorTipoHex(tipo) {
            switch (tipo) {
                case 'JOYA':
                    return '#00E676';
                case 'APUESTA':
                    return '#D4AF37';
                case 'BUNKER':
                    return '#FFA500';
                case 'LASTRE':
                    return '#FF4D4D';
                default:
                    return '#7E998F';
            }
        }

        // ================================================================
        // SPARKLINE PARA KPI CARDS (evolución de tipologías)
        // ================================================================
        function sparklineKPI(tipo, color, height = 28, width = 120) {
            const historicoTipos = contarTiposHistorico();
            const valores = meses.map(m => historicoTipos[m][tipo]);
            if (valores.length < 2) return '';
            const min = Math.min(...valores);
            const max = Math.max(...valores);
            const range = (max - min) || 1;
            const pad = 2;
            const puntos = valores.map((v, i) => {
                const x = (i / (valores.length - 1)) * (width - pad * 2) + pad;
                const y = height - pad - ((v - min) / range) * (height - pad * 2);
                return `${x.toFixed(1)},${y.toFixed(1)}`;
            }).join(' ');
            return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" style="display:block;">
                        <polyline points="${puntos}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <polygon points="${puntos}" fill="${color}20" opacity="0.3"/>
                    </svg>`;
        }

        // ================================================================
        // MAPA DE BURBUJAS SVG
        // ================================================================
        function renderMapaBurbujas() {
            // Normalizar coordenadas para un SVG 400x300
            const lats = tiendas.map(t => t.lat);
            const lngs = tiendas.map(t => t.lng);
            const minLat = Math.min(...lats) - 0.3;
            const maxLat = Math.max(...lats) + 0.3;
            const minLng = Math.min(...lngs) - 0.3;
            const maxLng = Math.max(...lngs) + 0.3;

            const toX = (lng) => ((lng - minLng) / (maxLng - minLng)) * 360 + 20;
            const toY = (lat) => ((maxLat - lat) / (maxLat - minLat)) * 260 + 20;

            return `
                        <div class="map-container">
                            <svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
                                <!-- Fondo sutil -->
                                <rect width="400" height="300" fill="rgba(11,22,18,0.6)" rx="8"/>
                                <!-- Líneas de cuadrícula decorativas -->
                                ${[0, 1, 2].map(i => `
                                    <line x1="${20 + i*120}" y1="20" x2="${20 + i*120}" y2="280" stroke="rgba(212,175,55,0.06)" stroke-width="1"/>
                                    <line x1="20" y1="${20 + i*87}" x2="380" y2="${20 + i*87}" stroke="rgba(212,175,55,0.06)" stroke-width="1"/>
                                `).join('')}
                                <!-- Burbujas -->
                                ${tiendas.map(t => {
                                    const cx = toX(t.lng);
                                    const cy = toY(t.lat);
                                    const r = 10 + (t.salud + t.resiliencia + t.potencial) / 3 * 6;
                                    const color = colorTipoHex(t.tipo);
                                    return `
                                        <circle cx="${cx}" cy="${cy}" r="${r}" 
                                                fill="${color}30" stroke="${color}" stroke-width="2"
                                                class="map-bubble" 
                                                style="filter: drop-shadow(0 0 6px ${color}40);"
                                                onmouseenter="this.setAttribute('r', ${r+4})" 
                                                onmouseleave="this.setAttribute('r', ${r})"/>
                                        <text x="${cx}" y="${cy + 2}" class="map-label" font-size="7" fill="#fff" font-weight="700">${t.nombre.split(' ').pop()}</text>
                                    `;
                                }).join('')}
                                <!-- Etiquetas de ciudades -->
                                ${[...new Set(tiendas.map(t => t.ciudad))].map(ciudad => {
                                    const t = tiendas.find(t => t.ciudad === ciudad);
                                    if (!t) return '';
                                    const cx = toX(t.lng);
                                    const cy = toY(t.lat) - 18;
                                    return `<text x="${cx}" y="${cy}" font-size="7" fill="#7E998F" text-anchor="middle" font-weight="600">${ciudad}</text>`;
                                }).join('')}
                            </svg>
                            <div class="map-legend">
                                ${['JOYA','APUESTA','BUNKER','LASTRE'].map(tipo => `
                                    <div class="map-legend-item">
                                        <div class="map-legend-dot" style="background:${colorTipoHex(tipo)};"></div>
                                        ${tipo}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
        }

        // ================================================================
        // DASHBOARD 1: DIAGNÓSTICO 4×3 CON DONUT + MAPA + SPARKLINES
        // ================================================================
function renderDiagnostico() {
    const counts = contarTipos();
    const total = tiendas.length;

    return `

                <div class="kpi-spark">${sparklineKPI('BUNKER', '#FFA500')}</div>

                <div class="kpi-spark">${sparklineKPI('LASTRE', '#FF4D4D')}</div>

        <!-- DONUT CHART + MAPA (2 columnas) -->
        <div class="two-col">

                            <div class="total">${total}</div>
                            <div class="label">Tiendas</div>
                        </div>
                    </div>
                    <div class="donut-legend">
                        ${['JOYA','APUESTA','BUNKER','LASTRE'].map(tipo => `
                            <div class="donut-legend-item">
                                <div class="donut-legend-dot" style="background:${colorTipoHex(tipo)};"></div>
                                ${tipo} <span style="color:#fff;font-weight:700;margin-left:4px;">${counts[tipo]}</span>
                                <span style="color:var(--steel-muted);font-size:10px;">(${((counts[tipo]/total)*100).toFixed(0)}%)</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>
            <div class="panel">
                <div class="panel-title">🗺️ Ubicación de Tiendas</div>
                ${renderMapaBurbujas()}
            </div>
        </div>

        <!-- ============================================================ -->
        <!-- TABLA DIAGNÓSTICO CON SPARKLINES (AHORA SÍ VISIBLE) -->
        <!-- ============================================================ -->
        <div style="font-size:10px;font-weight:700;color:var(--rolex-gold);letter-spacing:1px;text-transform:uppercase;font-family:'Cinzel';margin-top:24px;padding-top:12px;border-top:1px solid var(--border-deep);">
            📋 Evaluación por Tienda · Últimos 6 meses
        </div>
        <div style="overflow-x:auto;margin-top:8px;">
            <table class="matrix-table">
                <thead>
                    <tr>
                        <th style="min-width:120px;">Tienda</th>
                        <th>Ciudad</th>
                        <th>Salud</th>
                        <th>Resiliencia</th>
                        <th>Potencial</th>
                        <th>Exposición</th>
                        <th>Tipología</th>
                        <th>Tendencia</th>
                        <th style="min-width:80px;">Evolución 6m</th>
                    </tr>
                </thead>
                <tbody>
                    ${tiendas.map(t => {
                        const trend = calcularTendencia(t.historico, 'salud');
                        const trendLabel = trend.direccion === 'up' ? '▲ Mejora' : trend.direccion === 'down' ? '▼ Deterioro' : '→ Estable';
                        const trendClass = trend.direccion === 'up' ? 'up' : trend.direccion === 'down' ? 'down' : 'flat';
                        const color = colorTipo(t.tipo);
                        const valores = t.historico.map(h => h.salud);
                        return `
                            <tr class="${t.tipo.toLowerCase()}">
                                <td style="font-weight:600;color:#fff;text-align:left;padding-left:12px;">${t.nombre}</td>

                                <td>${t.salud.toFixed(1)}</td>
                                <td>${t.resiliencia.toFixed(1)}</td>
                                <td>${t.potencial.toFixed(1)}</td>
                                <td>${t.exposicion.toFixed(1)}</td>
                                <td><strong>${t.tipo}</strong></td>
                                <td><span class="trend-badge ${trendClass}">${trendLabel}</span></td>
                                <td class="sparkline-cell">${sparklineSVG(valores, color)}</td>
                            </tr>
                        `;
                    }).join('')}
                </tbody>
            </table>
        </div>

        <div class="narrative-box">
            <div class="narr-header"><span class="narr-icon">🧠</span><span class="narr-title">Narrativa IA · Diagnóstico con Histórico</span></div>
            <div class="narr-text">
                La red tiene <strong>${counts.JOYA} tiendas JOYA</strong> (${((counts.JOYA/total)*100).toFixed(0)}% del total) que son el motor de crecimiento. 
                <strong>${counts.APUESTA} tiendas APUESTA</strong> requieren inversión controlada. 
                Las <strong>${counts.BUNKER} tiendas BUNKER</strong> son estables pero sin crecimiento. 
                <strong>${counts.LASTRE} tienda(s) LASTRE</strong> debe(n) ser evaluadas para cierre.
                <br><br>
                <strong>Tendencias destacadas:</strong> 
                ${tiendas.filter(t => calcularTendencia(t.historico, 'salud').direccion === 'up').length} tiendas están mejorando su salud.
                ${tiendas.filter(t => calcularTendencia(t.historico, 'salud').direccion === 'down').length} tiendas muestran deterioro.
                <span style="color:var(--rolex-gold);">◆</span> La composición de la red ha mejorado en los últimos 6 meses: 
                <span class="trend-badge up">+${counts.JOYA - historicoTipos[meses[0]].JOYA} JOYA</span>
                <span class="trend-badge down">${counts.LASTRE - historicoTipos[meses[0]].LASTRE > 0 ? '+' : ''}${counts.LASTRE - historicoTipos[meses[0]].LASTRE} LASTRE</span>
            </div>
        </div>
    `;
}

        // ================================================================
        // OTROS DASHBOARDS (versiones simplificadas)
        // ================================================================
        function renderRiesgo() {

                            <div class="kpi"><div class="kpi-label">Riesgo Alto (Score < 2)</div><div class="kpi-value">${vulnerables.filter(t => t.exposicion < 1.5).length}</div><div class="kpi-delta down">▼ Crítico</div></div>

                                    <div style="background:var(--surface-card);border:1px solid var(--border-deep);border-radius:10px;padding:12px;text-align:center;">
                                        <div style="font-weight:600;color:#fff;">${t.nombre}</div>

        function renderEficiencia() {
            const sorted = [...tiendas].sort((a, b) => (b.salud + b.resiliencia + b.potencial) - (a.salud + a.resiliencia + a
                .potencial));
            const top3 = sorted.slice(0, 3);
            const bottom3 = sorted.slice(-3);
            return `
                        <div class="breadcrumb"><span class="active-crumb">🏆 Top/Bottom Performers</span></div>
                        <div class="two-col">
                            <div class="panel">
                                <div class="panel-title">🏆 Top 3 Tiendas</div>
                                ${top3.map(t => `
                                    <div class="hier-item">
                                        <div class="hi-dot" style="background:var(--hulk-vibrant);"></div>
                                        <span class="hi-name">${t.nombre}</span>
                                        <span class="hi-state s-green">Líder</span>
                                        <span class="hi-delta up">${((t.salud + t.resiliencia + t.potencial)/3).toFixed(1)}</span>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="panel">
                                <div class="panel-title">📉 Bottom 3 Tiendas</div>
                                ${bottom3.map(t => `
                                    <div class="hier-item">
                                        <div class="hi-dot" style="background:var(--red);"></div>
                                        <span class="hi-name">${t.nombre}</span>
                                        <span class="hi-state s-red">Rezagada</span>
                                        <span class="hi-delta down">${((t.salud + t.resiliencia + t.potencial)/3).toFixed(1)}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
        }

        function renderBrecha() {
            const avg = {
                salud: tiendas.reduce((s, t) => s + t.salud, 0) / tiendas.length,
                resiliencia: tiendas.reduce((s, t) => s + t.resiliencia, 0) / tiendas.length,
                potencial: tiendas.reduce((s, t) => s + t.potencial, 0) / tiendas.length,
                exposicion: tiendas.reduce((s, t) => s + t.exposicion, 0) / tiendas.length
            };
            return `
                        <div class="breadcrumb"><span class="active-crumb">📈 Análisis de Brecha</span></div>
                        <div class="narrative-box">
                            <div class="narr-header"><span class="narr-icon">📊</span><span class="narr-title">Brecha vs Promedio de la Cadena</span></div>
                            <div class="narr-text">Promedios: Salud <strong>${avg.salud.toFixed(1)}</strong> · Resiliencia <strong>${avg.resiliencia.toFixed(1)}</strong> · Potencial <strong>${avg.potencial.toFixed(1)}</strong> · Exposición <strong>${avg.exposicion.toFixed(1)}</strong></div>
                        </div>
                        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:8px;">
                            ${tiendas.map(t => {
                                const brecha = ((t.salud + t.resiliencia + t.potencial + t.exposicion) / 4) - 
                                               ((avg.salud + avg.resiliencia + avg.potencial + avg.exposicion) / 4);
                                const color = brecha >= 0 ? 'var(--hulk-vibrant)' : 'var(--red)';
                                return `
                                    <div style="background:var(--surface-card);border:1px solid var(--border-deep);border-radius:10px;padding:12px;text-align:center;">
                                        <div style="font-weight:600;color:#fff;">${t.nombre}</div>
                                        <div style="font-size:20px;font-weight:700;color:${color};">${brecha >= 0 ? '+' : ''}${brecha.toFixed(1)}</div>
                                        <div style="font-size:10px;color:var(--steel-muted);">vs promedio</div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `;
        }

        function renderSimulacion() {
            const counts = contarTipos();
            return `
                        <div class="breadcrumb"><span class="active-crumb">⚙️ Simulación de Pesos</span></div>
                        <div class="narrative-box">
                            <div class="narr-header"><span class="narr-icon">🎯</span><span class="narr-title">Ajuste de Pesos Personalizados</span></div>
                            <div class="narr-text">Modifica los pesos de cada variable para ver cómo cambia la tipología de las tiendas.</div>
                        </div>
                        <div class="two-col">
                            <div class="panel">
                                <div class="panel-title">Pesos Actuales</div>
                                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;">
                                    <span style="color:var(--steel-muted);">Salud Financiera</span><span style="color:#fff;font-weight:600;">33%</span>
                                    <span style="color:var(--steel-muted);">Resiliencia</span><span style="color:#fff;font-weight:600;">33%</span>
                                    <span style="color:var(--steel-muted);">Potencial</span><span style="color:#fff;font-weight:600;">33%</span>
                                    <span style="color:var(--steel-muted);">Exposición</span><span style="color:#fff;font-weight:600;">33%</span>
                                </div>
                            </div>
                            <div class="panel">
                                <div class="panel-title">Resultado</div>
                                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;">
                                    <span style="color:var(--steel-muted);">JOYA</span><span style="color:var(--hulk-vibrant);font-weight:700;">${counts.JOYA}</span>
                                    <span style="color:var(--steel-muted);">APUESTA</span><span style="color:var(--rolex-gold);font-weight:700;">${counts.APUESTA}</span>
                                    <span style="color:var(--steel-muted);">BUNKER</span><span style="color:#FFA500;font-weight:700;">${counts.BUNKER}</span>
                                    <span style="color:var(--steel-muted);">LASTRE</span><span style="color:var(--red);font-weight:700;">${counts.LASTRE}</span>
                                </div>
                            </div>
                        </div>
                    `;
        }

        function renderAccion() {
            const counts = contarTipos();
            return `
                        <div class="breadcrumb"><span class="active-crumb">📋 Plan de Acción</span></div>
                        <div class="narrative-box">
                            <div class="narr-header"><span class="narr-icon">📌</span><span class="narr-title">Recomendaciones Estratégicas</span></div>
                            <div class="narr-text">
                                <strong>JOYA (${counts.JOYA} tiendas):</strong> Invertir y atacar.<br>
                                <strong>APUESTA (${counts.APUESTA} tiendas):</strong> Invertir con cautela.<br>
                                <strong>BUNKER (${counts.BUNKER} tiendas):</strong> Mantener mínimo.<br>
                                <strong>LASTRE (${counts.LASTRE} tiendas):</strong> Prioridad de cierre.
                            </div>
                        </div>
                        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:8px;">
                            ${tiendas.map(t => `
                                <div style="background:var(--surface-card);border:1px solid var(--border-deep);border-radius:10px;padding:12px;text-align:center;border-left:4px solid ${colorTipo(t.tipo)};">
                                    <div style="font-weight:600;color:#fff;">${t.nombre}</div>
                                    <div style="font-size:12px;font-weight:700;margin-top:4px;color:${colorTipo(t.tipo)};">${t.tipo}</div>
                                    <div style="font-size:10px;color:var(--steel-muted);margin-top:4px;">
                                        ${t.tipo === 'JOYA' ? '🚀 Invertir' : t.tipo === 'APUESTA' ? '⚠️ Evaluar' : t.tipo === 'BUNKER' ? '🛡️ Defender' : '🔴 Cerrar'}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
        }

        function renderEscenarios() {
            return `
                        <div class="breadcrumb"><span class="active-crumb">📌 Matriz de Escenarios</span></div>
                        <div style="font-size:10px;font-weight:700;color:var(--rolex-gold);letter-spacing:1px;text-transform:uppercase;font-family:'Cinzel';">Crecimiento vs Depresión</div>
                        <div style="overflow-x:auto;">
                            <table class="matrix-table">
                                <thead><tr><th>Tipología</th><th>🔮 Crecimiento</th><th>🐻 Depresión</th></tr></thead>
                                <tbody>
                                    <tr><td class="joya">JOYA</td><td style="color:var(--hulk-vibrant);">INVERTIR Y ATACAR</td><td style="color:var(--hulk-vibrant);">PROTEGER Y FORTALECER</td></tr>
                                    <tr><td class="apuesta">APUESTA</td><td style="color:var(--rolex-gold);">INVERTIR CON CAUTELA</td><td style="color:var(--rolex-gold);">CONGELAR INVERSIÓN</td></tr>
                                    <tr><td class="bunker">BUNKER</td><td style="color:#FFA500;">MANTENER MÍNIMO</td><td style="color:#FFA500;">RESERVAR COMO COLCHÓN</td></tr>
                                    <tr><td class="lastre">LASTRE</td><td style="color:var(--red);">CERRAR/VENDER</td><td style="color:var(--red);">PRIORIDAD DE CIERRE</td></tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="narrative-box">
                            <div class="narr-header"><span class="narr-icon">📊</span><span class="narr-title">Recomendación Estratégica</span></div>
                            <div class="narr-text">En escenario de <strong>crecimiento</strong>, priorizar inversión en JOYA y evaluar APUESTA. En <strong>depresión</strong>, proteger JOYA, usar BUNKER como colchón y cerrar LASTRE.</div>
                        </div>
                    `;
        }

        // ================================================================
        // DASHBOARD 8: EVOLUCIÓN HISTÓRICA
        // ================================================================
        let chartInstance = null;

        function renderHistorico() {
            const datasets = tiendas.map(t => {
                const color = colorTipoHex(t.tipo);
                return {
                    label: t.nombre,
                    data: t.historico.map(h => parseFloat(((h.salud + h.resiliencia + h.potencial) / 3).toFixed(2))),
                    borderColor: color,
                    backgroundColor: color + '20',
                    borderWidth: 2,
                    pointRadius: 3,
                    tension: 0.3,
                    fill: false
                };
            });

            const saludCadena = meses.map((_, i) => {
                return tiendas.reduce((sum, t) => sum + t.historico[i].salud, 0) / tiendas.length;
            });
            const resilienciaCadena = meses.map((_, i) => {
                return tiendas.reduce((sum, t) => sum + t.historico[i].resiliencia, 0) / tiendas.length;
            });
            const potencialCadena = meses.map((_, i) => {
                return tiendas.reduce((sum, t) => sum + t.historico[i].potencial, 0) / tiendas.length;
            });

            const html = `
                        <div class="breadcrumb"><span class="active-crumb">📈 Evolución Histórica · 6 Meses</span></div>

                        <div class="narrative-box">
                            <div class="narr-header"><span class="narr-icon">📊</span><span class="narr-title">Salud de la Cadena · Evolución Agregada</span></div>
                            <div class="narr-text">
                                La <strong>salud promedio de la cadena</strong> muestra una tendencia 
                                ${saludCadena[saludCadena.length-1] > saludCadena[0] ? '📈 positiva' : '📉 negativa'} 
                                en los últimos 6 meses. 
                                <strong>Resiliencia</strong> se mantiene ${resilienciaCadena[resilienciaCadena.length-1] > resilienciaCadena[0] ? 'en mejora' : 'estable'},
                                mientras que <strong>Potencial</strong> 
                                ${potencialCadena[potencialCadena.length-1] > potencialCadena[0] ? 'está creciendo' : 'requiere atención'}.
                            </div>
                        </div>

                        <div class="panel">
                            <div class="panel-title">📊 Salud de la Cadena (Promedio Ponderado)</div>
                            <div class="chart-wrap">
                                <canvas id="healthChart"></canvas>
                            </div>
                        </div>

                        <div class="panel">
                            <div class="panel-title">📈 Trayectoria de Tiendas · Puntaje Total</div>
                            <div class="chart-wrap">
                                <canvas id="trendChart"></canvas>
                            </div>
                        </div>

                        <div style="font-size:10px;font-weight:700;color:var(--rolex-gold);letter-spacing:1px;text-transform:uppercase;font-family:'Cinzel';margin-top:8px;">Resumen de Tendencias</div>
                        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:8px;">
                            ${tiendas.map(t => {
                                const trend = calcularTendencia(t.historico, 'salud');
                                const trendIcon = trend.direccion === 'up' ? '▲' : trend.direccion === 'down' ? '▼' : '→';
                                const trendColor = trend.direccion === 'up' ? 'var(--hulk-vibrant)' : trend.direccion === 'down' ? 'var(--red)' : 'var(--rolex-gold)';
                                return `
                                    <div style="background:var(--surface-card);border:1px solid var(--border-deep);border-radius:10px;padding:12px;display:flex;justify-content:space-between;align-items:center;">
                                        <span style="font-weight:600;color:#fff;">${t.nombre}</span>
                                        <span style="color:${trendColor};font-weight:700;font-size:14px;">
                                            ${trendIcon} ${trend.delta > 0 ? '+' : ''}${trend.delta.toFixed(2)}
                                        </span>
                                        <span class="trend-badge ${trend.direccion}">${trend.direccion === 'up' ? 'Mejora' : trend.direccion === 'down' ? 'Deterioro' : 'Estable'}</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `;

            document.getElementById('mainContent').innerHTML = html;

            setTimeout(() => {
                renderHealthChart(saludCadena, resilienciaCadena, potencialCadena);
                renderTrendChart(datasets);
            }, 100);
        }

        function renderHealthChart(salud, resiliencia, potencial) {
            const ctx = document.getElementById('healthChart');
            if (!ctx) return;
            if (chartInstance) { chartInstance.destroy();
                chartInstance = null; }

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: meses,
                    datasets: [{
                        label: 'Salud Financiera',
                        data: salud,
                        borderColor: '#00E676',
                        backgroundColor: 'rgba(0, 230, 118, 0.15)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 4,
                        pointBackgroundColor: '#00E676'
                    }, {
                        label: 'Resiliencia Defensiva',
                        data: resiliencia,
                        borderColor: '#D4AF37',
                        backgroundColor: 'rgba(212, 175, 55, 0.10)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 4,
                        pointBackgroundColor: '#D4AF37',
                        borderDash: [4, 3]
                    }, {
                        label: 'Potencial Ofensivo',
                        data: potencial,
                        borderColor: '#29B6F6',
                        backgroundColor: 'rgba(41, 182, 246, 0.10)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 4,
                        pointBackgroundColor: '#29B6F6',
                        borderDash: [2, 3]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: '#CBD5E1', font: { size: 11, family: 'Outfit' }, boxWidth: 12 }
                        },
                        tooltip: {
                            backgroundColor: '#0B1612',
                            borderColor: 'rgba(212, 175, 55, 0.4)',
                            borderWidth: 1,
                            titleColor: '#F1F5F9',
                            bodyColor: '#7E998F',
                            padding: 10
                        }
                    },
                    scales: {
                        x: { ticks: { color: '#7E998F', font: { size: 10 } }, grid: { color: 'rgba(212, 175, 55, 0.08)' } },
                        y: { min: 0.5, max: 3.0, ticks: { color: '#7E998F', font: { size: 10 }, stepSize: 0.5 },
                            grid: { color: 'rgba(212, 175, 55, 0.08)' } }
                    }
                }
            });
        }

        function renderTrendChart(datasets) {
            const ctx = document.getElementById('trendChart');
            if (!ctx) return;

            new Chart(ctx, {
                type: 'line',
                data: { labels: meses, datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: '#CBD5E1', font: { size: 10, family: 'Outfit' }, boxWidth: 10, padding: 6 }
                        },
                        tooltip: {
                            backgroundColor: '#0B1612',
                            borderColor: 'rgba(212, 175, 55, 0.4)',
                            borderWidth: 1,
                            titleColor: '#F1F5F9',
                            bodyColor: '#7E998F',
                            padding: 10
                        }
                    },
                    scales: {
                        x: { ticks: { color: '#7E998F', font: { size: 9 } }, grid: { color: 'rgba(212, 175, 55, 0.05)' } },
                        y: { min: 0.5, max: 3.0, ticks: { color: '#7E998F', font: { size: 9 }, stepSize: 0.5 },
                            grid: { color: 'rgba(212, 175, 55, 0.05)' } }
                    }
                }
            });
        }

        // ================================================================
        // CAMBIO DE VISTA
        // ================================================================
        function cambiarVista(vista) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => {
                const txt = el.textContent.trim().toLowerCase();
                const map = {
                    'diagnostico': 'diagnóstico',
                    'riesgo': 'mapa',
                    'eficiencia': 'top',
                    'brecha': 'brecha',
                    'simulacion': 'simulación',
                    'accion': 'acción',
                    'escenarios': 'matriz',
                    'historico': 'evolución'
                };
                if (txt.includes(map[vista] || vista)) el.classList.add('active');
            });

            if (chartInstance) { chartInstance.destroy();
                chartInstance = null; }

            switch (vista) {
case 'diagnostico':
    document.getElementById('mainContent').innerHTML = renderDiagnostico();
    // Esperar a que el DOM se actualice antes de renderizar el donut
    setTimeout(() => renderDonut(), 150);
    break;
	case 'riesgo':
                    document.getElementById('mainContent').innerHTML = renderRiesgo();
                    break;
                case 'eficiencia':
                    document.getElementById('mainContent').innerHTML = renderEficiencia();
                    break;
                case 'brecha':
                    document.getElementById('mainContent').innerHTML = renderBrecha();
                    break;
                case 'simulacion':
                    document.getElementById('mainContent').innerHTML = renderSimulacion();
                    break;
                case 'accion':
                    document.getElementById('mainContent').innerHTML = renderAccion();
                    break;
                case 'escenarios':
                    document.getElementById('mainContent').innerHTML = renderEscenarios();
                    break;
                case 'historico':
                    renderHistorico();
                    break;
                default:
                    document.getElementById('mainContent').innerHTML = renderDiagnostico();
                    setTimeout(() => renderDonut(), 100);
            }
        }

        // ================================================================
        // RENDER DONUT CHART
        // ================================================================
        let donutInstance = null;

        function renderDonut() {
            const canvas = document.getElementById('donutChart');
            if (!canvas) return;
            if (donutInstance) { donutInstance.destroy();
                donutInstance = null; }

            const counts = contarTipos();
            const ctx = canvas.getContext('2d');
            donutInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['JOYA', 'APUESTA', 'BUNKER', 'LASTRE'],
                    datasets: [{
                        data: [counts.JOYA, counts.APUESTA, counts.BUNKER, counts.LASTRE],
                        backgroundColor: ['#00E676', '#D4AF37', '#FFA500', '#FF4D4D'],
                        borderColor: ['#00E676', '#D4AF37', '#FFA500', '#FF4D4D'],
                        borderWidth: 0,
                        hoverOffset: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '70%',
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#0B1612',
                            borderColor: 'rgba(212, 175, 55, 0.4)',
                            borderWidth: 1,
                            titleColor: '#F1F5F9',
                            bodyColor: '#7E998F',
                            padding: 10,
                            callbacks: {
                                label: function(context) {
                                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    const pct = total > 0 ? ((context.parsed / total) * 100).toFixed(0) : 0;
                                    return context.label + ': ' + context.parsed + ' tiendas (' + pct + '%)';
                                }
                            }
                        }
                    },
                    animation: {
                        animateRotate: true,
                        duration: 800
                    }
                }
            });
        }

        // ================================================================
        // INICIALIZACIÓN
        // ================================================================
        document.getElementById('dateLabel').textContent = new Date().toLocaleDateString('es-MX', { weekday: 'long',
            year: 'numeric', month: 'long', day: 'numeric' });
        cambiarVista('diagnostico');
    </script>
</body>
</html>
