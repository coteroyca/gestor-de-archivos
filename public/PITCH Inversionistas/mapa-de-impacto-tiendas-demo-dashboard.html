<!DOCTYPE html>
<html lang="es">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Impacto · RetailMind 360°</title>
    <!-- Fuentes Luxury: Cinzel y Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* === PALETA ROLEX HULK EXCLUSIVE === */
            --hulk: #008744;
            --hulk-vibrant: #00E676;
            --hulk-dark: #002B15;
            --hulk-glow: rgba(0, 230, 118, 0.25);
            
            --abyssal: #050B08;
            --surface: #0B1612;
            --surface-card: #0F1F1A;
            --border-deep: rgba(212, 175, 55, 0.25);
            --border-glow: rgba(212, 175, 55, 0.4);
            
            --rolex-gold: #D4AF37;
            --rolex-gold-light: #F3E5AB;
            --steel-light: #F1F5F9;
            --steel-muted: #7E998F;
            --steel-silver: #CBD5E1;
            
            --red: #FF4D4D;
            --gold: #D4AF37;
            --blue-accent: #29B6F6;
            --purple: #AB47BC;
        }

        body {
            background: var(--abyssal);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 135, 68, 0.15) 0%, transparent 75%),
                radial-gradient(circle at 85% 30%, rgba(212, 175, 55, 0.05) 0%, transparent 50%);
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--steel-light);
            min-height: 100vh;
            font-size: 13px;
            line-height: 1.5;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: var(--abyssal); }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--hulk), var(--rolex-gold));
            border-radius: 20px;
        }

        .shell {
            display: grid;
            grid-template-rows: 56px 1fr;
            grid-template-columns: 230px 1fr;
            height: 100vh;
            overflow: hidden;
        }

        /* TOPBAR */
        .topbar {
            grid-column: 1/-1;
            background: rgba(11, 22, 18, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-deep);
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            gap: 1rem;
            position: relative;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .topbar img { height: 28px; filter: drop-shadow(0 0 8px rgba(0,230,118,0.3)); }
        .topbar-divider {
            width: 1px;
            height: 24px;
            background: linear-gradient(180deg, transparent, var(--rolex-gold), transparent);
            margin: 0 0.5rem;
            opacity: 0.5;
        }
        .topbar-date { font-size: 11px; color: var(--steel-muted); letter-spacing: 0.5px; }
        .topbar-badge {
            background: linear-gradient(135deg, rgba(0, 135, 68, 0.3), rgba(212, 175, 55, 0.15));
            color: var(--rolex-gold-light);
            padding: 3px 14px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            border: 1px solid var(--rolex-gold);
            margin-left: auto;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }
        .topbar-user { display: flex; align-items: center; gap: 8px; margin-left: 1rem; }
        .avatar {
            width: 30px; height: 30px; border-radius: 50%;
            background: linear-gradient(135deg, var(--rolex-gold), var(--hulk));
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 800; color: #000;
            border: 1px solid var(--rolex-gold-light);
            box-shadow: 0 0 8px var(--hulk-glow);
        }

        /* SIDEBAR */
        .sidebar {
            background: var(--surface);
            border-right: 1px solid var(--border-deep);
            padding: 1rem 0;
            overflow-y: auto;
        }
        .sidebar-section {
            padding: 0.5rem 1.2rem;
            font-size: 10px;
            font-weight: 700;
            color: var(--rolex-gold);
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-top: 0.5rem;
            font-family: 'Cinzel', serif;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 1.2rem;
            cursor: pointer;
            color: var(--steel-muted);
            font-size: 12px;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }
        .nav-item:hover {
            color: var(--steel-light);
            background: rgba(0, 230, 118, 0.05);
            border-left-color: var(--rolex-gold);
        }
        .nav-item.active {
            color: #fff;
            border-left-color: var(--rolex-gold);
            background: linear-gradient(90deg, rgba(0, 135, 68, 0.25) 0%, transparent 100%);
            font-weight: 600;
        }
        .nav-icon { font-size: 14px; width: 18px; text-align: center; }

        /* MAIN */
        .main {
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            background: transparent;
        }

        /* BREADCRUMB */
        .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--steel-muted); }
        .breadcrumb span { cursor: pointer; transition: color 0.15s; }
        .breadcrumb span:hover { color: var(--rolex-gold); }
        .breadcrumb .active-crumb { color: var(--steel-light); font-weight: 600; }

        /* DRILL TABS */
        .drill-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
        .drill-tab {
            padding: 6px 16px; border-radius: 20px; font-size: 11px; font-weight: 600;
            cursor: pointer; transition: all 0.2s ease; border: 1px solid var(--border-deep);
            color: var(--steel-muted); background: rgba(15, 31, 26, 0.6);
        }
        .drill-tab:hover { color: var(--steel-light); border-color: var(--hulk); background: rgba(0, 135, 68, 0.15); }
        .drill-tab.active {
            background: linear-gradient(135deg, var(--hulk), var(--hulk-dark));
            border-color: var(--rolex-gold); color: #fff; box-shadow: 0 0 12px var(--hulk-glow);
        }

        /* KPI CARD */
        .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .kpi {
            background: linear-gradient(145deg, var(--surface-card), var(--surface));
            border: 1px solid var(--border-deep);
            border-radius: 12px;
            padding: 1.1rem 1.2rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .kpi::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--rolex-gold), transparent);
            opacity: 0.5;
        }
        .kpi:hover {
            border-color: var(--rolex-gold);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.15);
        }
        .kpi-label {
            font-size: 10px; color: var(--steel-muted); font-weight: 700;
            letter-spacing: 1px; text-transform: uppercase; font-family: 'Cinzel', serif;
        }
        .kpi-value {
            font-size: 26px; font-weight: 700; margin: 6px 0 2px;
            color: #fff; font-family: 'Cinzel', serif; text-shadow: 0 0 10px rgba(255,255,255,0.1);
        }
        .kpi-delta { font-size: 11px; font-weight: 600; }
        .up { color: var(--hulk-vibrant); text-shadow: 0 0 6px rgba(0, 230, 118, 0.3); }
        .down { color: var(--red); }
        .flat { color: var(--rolex-gold); }

        /* STATE GRID */
        .state-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .state-card {
            background: linear-gradient(145deg, var(--surface-card), var(--surface));
            border: 1px solid var(--border-deep);
            border-radius: 14px; padding: 1.2rem;
            transition: all 0.25s ease;
        }
        .state-card:hover {
            border-color: var(--rolex-gold); transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 15px rgba(212, 175, 55, 0.2);
        }
        .sc-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .sc-domain {
            font-size: 10px; font-weight: 700; color: var(--rolex-gold);
            letter-spacing: 1px; text-transform: uppercase; font-family: 'Cinzel', serif;
        }
        .sc-status { font-size: 9px; padding: 2px 10px; border-radius: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .s-green { background: rgba(0, 230, 118, 0.12); color: var(--hulk-vibrant); border: 1px solid rgba(0, 230, 118, 0.3); }
        .s-red { background: rgba(239, 68, 68, 0.12); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.3); }
        .s-yellow { background: rgba(212, 175, 55, 0.12); color: var(--rolex-gold); border: 1px solid rgba(212, 175, 55, 0.3); }
        .s-blue { background: rgba(41, 182, 246, 0.12); color: var(--blue-accent); border: 1px solid rgba(41, 182, 246, 0.3); }
        .s-purple { background: rgba(171, 71, 188, 0.12); color: var(--purple); border: 1px solid rgba(171, 71, 188, 0.3); }
        .sc-state { font-size: 15px; font-weight: 700; margin-bottom: 8px; color: #fff; }
        .sc-row { display: flex; justify-content: space-between; align-items: center; margin: 4px 0; font-size: 11px; color: var(--steel-muted); }
        .sc-row strong { color: var(--steel-light); font-weight: 600; }

        /* PANELS */
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .panel {
            background: linear-gradient(145deg, var(--surface-card), var(--surface));
            border: 1px solid var(--border-deep); border-radius: 14px; padding: 1.2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .panel-title {
            font-size: 11px; font-weight: 700; color: var(--rolex-gold);
            letter-spacing: 1px; text-transform: uppercase; margin-bottom: 14px; font-family: 'Cinzel', serif;
        }

        /* HIERARCHY LIST */
        .hier-item {
            display: flex; align-items: center; gap: 10px; padding: 10px 0;
            border-bottom: 1px solid var(--border-deep);
            transition: all 0.2s ease;
        }
        .hier-item:last-child { border-bottom: none; }
        .hier-item:hover { padding-left: 6px; }
        .hier-item:hover .hi-name { color: var(--hulk-vibrant); }
        .hi-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 6px currentColor; }
        .hi-name { font-size: 12px; font-weight: 500; flex: 1; color: var(--steel-light); }
        .hi-state { font-size: 10px; padding: 2px 8px; border-radius: 8px; font-weight: 700; }
        .hi-delta { font-size: 11px; font-weight: 600; min-width: 50px; text-align: right; }
        .hi-arrow { color: var(--rolex-gold); font-size: 14px; }

        /* NARRATIVE BOX */
        .narrative-box {
            background: linear-gradient(135deg, rgba(0, 135, 68, 0.12) 0%, rgba(15, 31, 26, 0.8) 100%);
            border: 1px solid var(--border-glow);
            border-left: 4px solid var(--rolex-gold);
            border-radius: 14px; padding: 1.2rem;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.4);
        }
        .narr-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .narr-icon { font-size: 16px; }
        .narr-title {
            font-size: 11px; font-weight: 700; color: var(--rolex-gold);
            letter-spacing: 1px; text-transform: uppercase; font-family: 'Cinzel', serif;
        }
        .narr-text { font-size: 12px; color: var(--steel-silver); line-height: 1.7; }
        .narr-text strong { color: #fff; font-weight: 600; }

        /* CHART WRAP */
        .chart-wrap { position: relative; height: 190px; margin-top: 8px; }

        /* MATRIX TABLE */
        .matrix-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-top: 8px;
        }
        .matrix-table th, .matrix-table td {
            padding: 10px 12px;
            text-align: center;
            border: 1px solid var(--border-deep);
        }
        .matrix-table th {
            background: var(--surface);
            color: var(--rolex-gold);
            font-family: 'Cinzel', serif;
            letter-spacing: 0.5px;
            font-size: 10px;
        }
        .matrix-table td {
            color: var(--steel-silver);
        }
        .matrix-table .joya { background: rgba(0, 230, 118, 0.15); color: var(--hulk-vibrant); font-weight: 700; }
        .matrix-table .apuesta { background: rgba(212, 175, 55, 0.15); color: var(--rolex-gold); font-weight: 700; }
        .matrix-table .bunker { background: rgba(255, 165, 0, 0.15); color: #FFA500; font-weight: 700; }
        .matrix-table .lastre { background: rgba(255, 77, 77, 0.15); color: var(--red); font-weight: 700; }

        /* RESPONSIVE */
        @media (max-width: 720px) {
            .shell { grid-template-columns: 1fr; grid-template-rows: 56px 1fr; }
            .topbar { padding: 0 0.75rem; gap: 0.6rem; }
            .topbar img { height: 22px; max-width: 130px; object-fit: contain; }
            .topbar-badge, .topbar-user, .topbar-date { display: none; }
            .sidebar { display: none; }
            .main { grid-column: 1; padding: 1rem; gap: 1rem; }
            .kpi-row { grid-template-columns: repeat(2, 1fr); }
            .state-grid, .two-col { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="shell">

        <!-- TOPBAR -->
        <div class="topbar">
            <img src="https://gestor-de-archivos.vercel.app/assets/logos/logo-retailmind-hulk-transparente.png" alt="RetailMind 360°" style="height:32px;">
            <div class="topbar-divider"></div>
            <span style="font-size:11px;color:var(--steel-muted);letter-spacing:0.5px;">Mapa de Impacto · Demo</span>
            <span class="topbar-badge">7 Dashboards</span>
            <div class="topbar-divider"></div>
            <span class="topbar-date" id="dateLabel">lunes, 31 de agosto de 2026</span>
            <div class="topbar-user" style="margin-left:auto">
                <span style="font-size:11px;color:var(--steel-muted)">Demo Interactiva</span>
                <div class="avatar">RM</div>
            </div>
        </div>

        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-section">Navegación</div>
            <div class="nav-item active" onclick="cambiarVista('diagnostico')"><span class="nav-icon">📊</span> Diagnóstico 4×3</div>
            <div class="nav-item" onclick="cambiarVista('riesgo')"><span class="nav-icon">🗺️</span> Mapa de Riesgo</div>
            <div class="nav-item" onclick="cambiarVista('eficiencia')"><span class="nav-icon">🏆</span> Top/Bottom Performers</div>
            <div class="nav-item" onclick="cambiarVista('brecha')"><span class="nav-icon">📈</span> Análisis de Brecha</div>
            <div class="nav-item" onclick="cambiarVista('simulacion')"><span class="nav-icon">⚙️</span> Simulación de Pesos</div>
            <div class="nav-item" onclick="cambiarVista('accion')"><span class="nav-icon">📋</span> Plan de Acción</div>
            <div class="nav-item" onclick="cambiarVista('escenarios')"><span class="nav-icon">📌</span> Matriz de Escenarios</div>
            <div class="sidebar-section" style="margin-top:auto;">Sistema</div>
            <div class="nav-item"><span class="nav-icon">⚙️</span> Configuración</div>
        </div>

        <!-- MAIN -->
        <div class="main" id="mainContent">
            <!-- Aquí se inyecta el contenido dinámico -->
        </div>
    </div>

    <script>
        // ================================================================
        // DATOS DE EJEMPLO (10 tiendas)
        // ================================================================
        const tiendas = [
            { nombre: 'Plaza Norte', ciudad: 'Caracas', salud: 2.8, resiliencia: 2.9, potencial: 2.9, exposicion: 2.7, tipo: 'JOYA' },
            { nombre: 'Plaza Centro', ciudad: 'Caracas', salud: 2.7, resiliencia: 2.7, potencial: 2.8, exposicion: 2.6, tipo: 'JOYA' },
            { nombre: 'Plaza Este', ciudad: 'Caracas', salud: 2.5, resiliencia: 2.6, potencial: 2.8, exposicion: 2.5, tipo: 'JOYA' },
            { nombre: 'Plaza Oeste', ciudad: 'Caracas', salud: 2.6, resiliencia: 2.8, potencial: 2.7, exposicion: 2.8, tipo: 'JOYA' },
            { nombre: 'Plaza Sur', ciudad: 'Caracas', salud: 2.8, resiliencia: 2.7, potencial: 2.9, exposicion: 2.4, tipo: 'JOYA' },
            { nombre: 'Plaza Maracaibo', ciudad: 'Maracaibo', salud: 1.2, resiliencia: 1.0, potencial: 3.0, exposicion: 1.3, tipo: 'APUESTA' },
            { nombre: 'Plaza Valencia', ciudad: 'Valencia', salud: 1.0, resiliencia: 1.0, potencial: 2.7, exposicion: 1.3, tipo: 'APUESTA' },
            { nombre: 'Plaza Barquisimeto', ciudad: 'Barquisimeto', salud: 2.0, resiliencia: 3.0, potencial: 1.3, exposicion: 2.0, tipo: 'BUNKER' },
            { nombre: 'Plaza Maturín', ciudad: 'Maturín', salud: 2.0, resiliencia: 3.0, potencial: 1.0, exposicion: 2.0, tipo: 'BUNKER' },
            { nombre: 'Plaza San Cristóbal', ciudad: 'San Cristóbal', salud: 1.0, resiliencia: 1.0, potencial: 1.0, exposicion: 3.0, tipo: 'LASTRE' }
        ];

        // ================================================================
        // CONTADORES POR TIPO
        // ================================================================
        function contarTipos() {
            const counts = { JOYA: 0, APUESTA: 0, BUNKER: 0, LASTRE: 0 };
            tiendas.forEach(t => counts[t.tipo]++);
            return counts;
        }

        // ================================================================
        // DASHBOARD 1: DIAGNÓSTICO 4×3
        // ================================================================
        function renderDiagnostico() {
            const counts = contarTipos();
            return `
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
                    <div class="breadcrumb"><span class="active-crumb">Diagnóstico 4×3</span></div>
                    <div class="drill-tabs">
                        <div class="drill-tab active">Holding</div>
                        <div class="drill-tab">Sucursales</div>
                    </div>
                </div>

                <div class="kpi-row">
                    <div class="kpi"><div class="kpi-label">🟢 JOYA</div><div class="kpi-value">${counts.JOYA}</div><div class="kpi-delta up">▲ Alto potencial</div></div>
                    <div class="kpi"><div class="kpi-label">🟡 APUESTA</div><div class="kpi-value">${counts.APUESTA}</div><div class="kpi-delta flat">→ Atención</div></div>
                    <div class="kpi"><div class="kpi-label">🟠 BUNKER</div><div class="kpi-value">${counts.BUNKER}</div><div class="kpi-delta flat">→ Defensa</div></div>
                    <div class="kpi"><div class="kpi-label">🔴 LASTRE</div><div class="kpi-value">${counts.LASTRE}</div><div class="kpi-delta down">▼ Cerrar</div></div>
                </div>

                <div style="font-size:10px;font-weight:700;color:var(--rolex-gold);letter-spacing:1px;text-transform:uppercase;font-family:'Cinzel';">Evaluación por Tienda</div>
                <div style="overflow-x:auto;">
                    <table class="matrix-table">
                        <thead><tr><th>Tienda</th><th>Salud</th><th>Resiliencia</th><th>Potencial</th><th>Exposición</th><th>Tipología</th></tr></thead>
                        <tbody>
                            ${tiendas.map(t => `
                                <tr class="${t.tipo.toLowerCase()}">
                                    <td style="font-weight:600;color:#fff;">${t.nombre}</td>
                                    <td>${t.salud.toFixed(1)}</td>
                                    <td>${t.resiliencia.toFixed(1)}</td>
                                    <td>${t.potencial.toFixed(1)}</td>
                                    <td>${t.exposicion.toFixed(1)}</td>
                                    <td><strong>${t.tipo}</strong></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>

                <div class="narrative-box">
                    <div class="narr-header"><span class="narr-icon">🧠</span><span class="narr-title">Narrativa IA · Diagnóstico</span></div>
                    <div class="narr-text">La red tiene <strong>${counts.JOYA} tiendas JOYA</strong> que son el motor de crecimiento. <strong>${counts.APUESTA} tiendas APUESTA</strong> requieren inversión controlada. Las <strong>${counts.BUNKER} tiendas BUNKER</strong> son estables pero sin crecimiento. La tienda <strong>LASTRE</strong> debe ser evaluada para cierre.</div>
                </div>
            `;
        }

        // ================================================================
        // DASHBOARD 2: MAPA DE RIESGO
        // ================================================================
        function renderRiesgo() {
            const vulnerables = tiendas.filter(t => t.exposicion < 2.0);
            return `
                <div class="breadcrumb"><span class="active-crumb">🗺️ Mapa de Calor de Riesgo</span></div>
                <div class="kpi-row">
                    <div class="kpi"><div class="kpi-label">Tiendas Vulnerables</div><div class="kpi-value">${vulnerables.length}</div><div class="kpi-delta down">⚠️ Atención</div></div>
                    <div class="kpi"><div class="kpi-label">Exposición Promedio</div><div class="kpi-value">${(tiendas.reduce((s,t) => s + t.exposicion, 0) / tiendas.length).toFixed(1)}</div><div class="kpi-delta flat">→</div></div>
                    <div class="kpi"><div class="kpi-label">Riesgo Alto (Score < 2)</div><div class="kpi-value">${vulnerables.filter(t => t.exposicion < 1.5).length}</div><div class="kpi-delta down">▼ Crítico</div></div>
                </div>
                <div style="font-size:10px;font-weight:700;color:var(--rolex-gold);letter-spacing:1px;text-transform:uppercase;font-family:'Cinzel';">Mapa de Riesgo por Tienda</div>
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:8px;">
                    ${tiendas.map(t => {
                        const riesgo = t.exposicion < 1.5 ? '🔴 Alto' : t.exposicion < 2.0 ? '🟡 Medio' : '🟢 Bajo';
                        const color = t.exposicion < 1.5 ? 'var(--red)' : t.exposicion < 2.0 ? 'var(--rolex-gold)' : 'var(--hulk-vibrant)';
                        return `
                            <div style="background:var(--surface-card);border:1px solid var(--border-deep);border-radius:10px;padding:12px;text-align:center;">
                                <div style="font-weight:600;color:#fff;">${t.nombre}</div>
                                <div style="font-size:11px;color:var(--steel-muted);">Exposición: ${t.exposicion.toFixed(1)}</div>
                                <div style="margin-top:6px;font-weight:700;color:${color};">${riesgo}</div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        // ================================================================
        // DASHBOARD 3: TOP/BOTTOM PERFORMERS
        // ================================================================
        function renderEficiencia() {
            const sorted = [...tiendas].sort((a,b) => (b.salud + b.resiliencia + b.potencial) - (a.salud + a.resiliencia + a.potencial));
            const top3 = sorted.slice(0,3);
            const bottom3 = sorted.slice(-3);
            return `
                <div class="breadcrumb"><span class="active-crumb">🏆 Top/Bottom Performers</span></div>
                <div class="two-col">
                    <div class="panel">
                        <div class="panel-title">🏆 Top 3 Tiendas</div>
                        ${top3.map(t => `
                            <div class="hier-item">
                                <div class="hi-dot" style="background:var(--hulk-vibrant);"></div>
                                <span class="hi-name">${t.nombre}</span>
                                <span class="hi-state s-green">Líder</span>
                                <span class="hi-delta up">${((t.salud + t.resiliencia + t.potencial)/3).toFixed(1)}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="panel">
                        <div class="panel-title">📉 Bottom 3 Tiendas</div>
                        ${bottom3.map(t => `
                            <div class="hier-item">
                                <div class="hi-dot" style="background:var(--red);"></div>
                                <span class="hi-name">${t.nombre}</span>
                                <span class="hi-state s-red">Rezagada</span>
                                <span class="hi-delta down">${((t.salud + t.resiliencia + t.potencial)/3).toFixed(1)}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // ================================================================
        // DASHBOARD 4: ANÁLISIS DE BRECHA
        // ================================================================
        function renderBrecha() {
            const avg = {
                salud: tiendas.reduce((s,t) => s + t.salud, 0) / tiendas.length,
                resiliencia: tiendas.reduce((s,t) => s + t.resiliencia, 0) / tiendas.length,
                potencial: tiendas.reduce((s,t) => s + t.potencial, 0) / tiendas.length,
                exposicion: tiendas.reduce((s,t) => s + t.exposicion, 0) / tiendas.length
            };
            return `
                <div class="breadcrumb"><span class="active-crumb">📈 Análisis de Brecha</span></div>
                <div class="narrative-box">
                    <div class="narr-header"><span class="narr-icon">📊</span><span class="narr-title">Brecha vs Promedio de la Cadena</span></div>
                    <div class="narr-text">Promedios: Salud <strong>${avg.salud.toFixed(1)}</strong> · Resiliencia <strong>${avg.resiliencia.toFixed(1)}</strong> · Potencial <strong>${avg.potencial.toFixed(1)}</strong> · Exposición <strong>${avg.exposicion.toFixed(1)}</strong></div>
                </div>
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:8px;">
                    ${tiendas.map(t => {
                        const brecha = ((t.salud + t.resiliencia + t.potencial + t.exposicion) / 4) - 
                                       ((avg.salud + avg.resiliencia + avg.potencial + avg.exposicion) / 4);
                        const color = brecha >= 0 ? 'var(--hulk-vibrant)' : 'var(--red)';
                        return `
                            <div style="background:var(--surface-card);border:1px solid var(--border-deep);border-radius:10px;padding:12px;text-align:center;">
                                <div style="font-weight:600;color:#fff;">${t.nombre}</div>
                                <div style="font-size:20px;font-weight:700;color:${color};">${brecha >= 0 ? '+' : ''}${brecha.toFixed(1)}</div>
                                <div style="font-size:10px;color:var(--steel-muted);">vs promedio</div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        // ================================================================
        // DASHBOARD 5: SIMULACIÓN DE PESOS
        // ================================================================
        function renderSimulacion() {
            return `
                <div class="breadcrumb"><span class="active-crumb">⚙️ Simulación de Pesos</span></div>
                <div class="narrative-box">
                    <div class="narr-header"><span class="narr-icon">🎯</span><span class="narr-title">Ajuste de Pesos Personalizados</span></div>
                    <div class="narr-text">Modifica los pesos de cada variable para ver cómo cambia la tipología de las tiendas.</div>
                </div>
                <div class="two-col">
                    <div class="panel">
                        <div class="panel-title">Pesos Actuales</div>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;">
                            <span style="color:var(--steel-muted);">Salud Financiera</span><span style="color:#fff;font-weight:600;">33%</span>
                            <span style="color:var(--steel-muted);">Resiliencia</span><span style="color:#fff;font-weight:600;">33%</span>
                            <span style="color:var(--steel-muted);">Potencial</span><span style="color:#fff;font-weight:600;">33%</span>
                            <span style="color:var(--steel-muted);">Exposición</span><span style="color:#fff;font-weight:600;">33%</span>
                        </div>
                    </div>
                    <div class="panel">
                        <div class="panel-title">Resultado</div>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;">
                            <span style="color:var(--steel-muted);">JOYA</span><span style="color:var(--hulk-vibrant);font-weight:700;">5</span>
                            <span style="color:var(--steel-muted);">APUESTA</span><span style="color:var(--rolex-gold);font-weight:700;">2</span>
                            <span style="color:var(--steel-muted);">BUNKER</span><span style="color:#FFA500;font-weight:700;">2</span>
                            <span style="color:var(--steel-muted);">LASTRE</span><span style="color:var(--red);font-weight:700;">1</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // ================================================================
        // DASHBOARD 6: PLAN DE ACCIÓN
        // ================================================================
        function renderAccion() {
            const counts = contarTipos();
            return `
                <div class="breadcrumb"><span class="active-crumb">📋 Plan de Acción</span></div>
                <div class="narrative-box">
                    <div class="narr-header"><span class="narr-icon">📌</span><span class="narr-title">Recomendaciones Estratégicas</span></div>
                    <div class="narr-text">
                        <strong>JOYA (${counts.JOYA} tiendas):</strong> Invertir y atacar.<br>
                        <strong>APUESTA (${counts.APUESTA} tiendas):</strong> Invertir con cautela.<br>
                        <strong>BUNKER (${counts.BUNKER} tiendas):</strong> Mantener mínimo.<br>
                        <strong>LASTRE (${counts.LASTRE} tiendas):</strong> Prioridad de cierre.
                    </div>
                </div>
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:8px;">
                    ${tiendas.map(t => `
                        <div style="background:var(--surface-card);border:1px solid var(--border-deep);border-radius:10px;padding:12px;text-align:center;border-left:4px solid ${t.tipo === 'JOYA' ? 'var(--hulk-vibrant)' : t.tipo === 'APUESTA' ? 'var(--rolex-gold)' : t.tipo === 'BUNKER' ? '#FFA500' : 'var(--red)'};">
                            <div style="font-weight:600;color:#fff;">${t.nombre}</div>
                            <div style="font-size:12px;font-weight:700;margin-top:4px;color:${t.tipo === 'JOYA' ? 'var(--hulk-vibrant)' : t.tipo === 'APUESTA' ? 'var(--rolex-gold)' : t.tipo === 'BUNKER' ? '#FFA500' : 'var(--red)'};">${t.tipo}</div>
                            <div style="font-size:10px;color:var(--steel-muted);margin-top:4px;">
                                ${t.tipo === 'JOYA' ? '🚀 Invertir' : t.tipo === 'APUESTA' ? '⚠️ Evaluar' : t.tipo === 'BUNKER' ? '🛡️ Defender' : '🔴 Cerrar'}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // ================================================================
        // DASHBOARD 7: MATRIZ DE ESCENARIOS
        // ================================================================
        function renderEscenarios() {
            return `
                <div class="breadcrumb"><span class="active-crumb">📌 Matriz de Escenarios</span></div>
                <div style="font-size:10px;font-weight:700;color:var(--rolex-gold);letter-spacing:1px;text-transform:uppercase;font-family:'Cinzel';">Crecimiento vs Depresión</div>
                <div style="overflow-x:auto;">
                    <table class="matrix-table">
                        <thead><tr><th>Tipología</th><th>🔮 Crecimiento</th><th>🐻 Depresión</th></tr></thead>
                        <tbody>
                            <tr><td class="joya">JOYA</td><td style="color:var(--hulk-vibrant);">INVERTIR Y ATACAR</td><td style="color:var(--hulk-vibrant);">PROTEGER Y FORTALECER</td></tr>
                            <tr><td class="apuesta">APUESTA</td><td style="color:var(--rolex-gold);">INVERTIR CON CAUTELA</td><td style="color:var(--rolex-gold);">CONGELAR INVERSIÓN</td></tr>
                            <tr><td class="bunker">BUNKER</td><td style="color:#FFA500;">MANTENER MÍNIMO</td><td style="color:#FFA500;">RESERVAR COMO COLCHÓN</td></tr>
                            <tr><td class="lastre">LASTRE</td><td style="color:var(--red);">CERRAR/VENDER</td><td style="color:var(--red);">PRIORIDAD DE CIERRE</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="narrative-box">
                    <div class="narr-header"><span class="narr-icon">📊</span><span class="narr-title">Recomendación Estratégica</span></div>
                    <div class="narr-text">En escenario de <strong>crecimiento</strong>, priorizar inversión en JOYA y evaluar APUESTA. En <strong>depresión</strong>, proteger JOYA, usar BUNKER como colchón y cerrar LASTRE.</div>
                </div>
            `;
        }

        // ================================================================
        // CAMBIO DE VISTA
        // ================================================================
        function cambiarVista(vista) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => {
                if (el.textContent.trim().toLowerCase().includes(vista.replace('diagnostico','diagnóstico').replace('riesgo','mapa').replace('eficiencia','top').replace('brecha','brecha').replace('simulacion','simulación').replace('accion','acción').replace('escenarios','matriz'))) {
                    el.classList.add('active');
                }
            });
            const main = document.getElementById('mainContent');
            switch(vista) {
                case 'diagnostico': main.innerHTML = renderDiagnostico(); break;
                case 'riesgo': main.innerHTML = renderRiesgo(); break;
                case 'eficiencia': main.innerHTML = renderEficiencia(); break;
                case 'brecha': main.innerHTML = renderBrecha(); break;
                case 'simulacion': main.innerHTML = renderSimulacion(); break;
                case 'accion': main.innerHTML = renderAccion(); break;
                case 'escenarios': main.innerHTML = renderEscenarios(); break;
                default: main.innerHTML = renderDiagnostico();
            }
        }

        // ================================================================
        // INICIALIZACIÓN
        // ================================================================
        document.getElementById('dateLabel').textContent = new Date().toLocaleDateString('es-MX', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        cambiarVista('diagnostico');
    </script>
</body>
</html>
