<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DODET · Constructor de Escenarios</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --hulk: #008744;
            --hulk-vibrant: #00E676;
            --abyssal: #050B08;
            --surface: #0B1612;
            --surface-card: #0F1F1A;
            --border-deep: rgba(212, 175, 55, 0.25);
            --border-glow: rgba(212, 175, 55, 0.4);
            --rolex-gold: #D4AF37;
            --rolex-gold-light: #F3E5AB;
            --steel-light: #F1F5F9;
            --steel-muted: #7E998F;
            --steel-silver: #CBD5E1;
            --red: #FF4D4D;
            --blue-accent: #29B6F6;
            --orange: #FFA500;
        }

        body {
            background: var(--abyssal);
            background-image:
                radial-gradient(circle at 50% 0%, rgba(0, 135, 68, 0.15) 0%, transparent 75%),
                radial-gradient(circle at 85% 30%, rgba(212, 175, 55, 0.05) 0%, transparent 50%);
            font-family: 'Outfit', -apple-system, sans-serif;
            color: var(--steel-light);
            min-height: 100vh;
            font-size: 13px;
            line-height: 1.5;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--abyssal); }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--hulk), var(--rolex-gold));
            border-radius: 20px;
        }

        .shell {
            display: grid;
            grid-template-rows: 56px 1fr;
            grid-template-columns: 240px 1fr;
            height: 100vh;
            overflow: hidden;
        }

        /* TOPBAR */
        .topbar {
            grid-column: 1/-1;
            background: rgba(11, 22, 18, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-deep);
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            gap: 1rem;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .topbar img { height: 32px; filter: drop-shadow(0 0 8px rgba(0,230,118,0.3)); }
        .topbar-divider {
            width: 1px; height: 24px;
            background: linear-gradient(180deg, transparent, var(--rolex-gold), transparent);
            margin: 0 0.5rem; opacity: 0.5;
        }
        .topbar-title { font-size: 13px; color: var(--steel-muted); letter-spacing: 0.5px; }
        .topbar-badge {
            background: linear-gradient(135deg, rgba(0,135,68,0.3), rgba(212,175,55,0.15));
            color: var(--rolex-gold-light);
            padding: 3px 14px; border-radius: 20px;
            font-size: 10px; font-weight: 700;
            border: 1px solid var(--rolex-gold);
            margin-left: auto; letter-spacing: 1px;
            text-transform: uppercase;
        }
        .topbar-user { display: flex; align-items: center; gap: 8px; margin-left: 1rem; }
        .avatar {
            width: 30px; height: 30px; border-radius: 50%;
            background: linear-gradient(135deg, var(--rolex-gold), var(--hulk));
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 800; color: #000;
            border: 1px solid var(--rolex-gold-light);
        }

        /* SIDEBAR */
        .sidebar {
            background: var(--surface);
            border-right: 1px solid var(--border-deep);
            padding: 1rem 0;
            overflow-y: auto;
        }
        .sidebar-section {
            padding: 0.5rem 1.2rem;
            font-size: 10px; font-weight: 700;
            color: var(--rolex-gold);
            letter-spacing: 1.2px; text-transform: uppercase;
            margin-top: 0.5rem;
            font-family: 'Cinzel', serif;
        }
        .nav-item {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 1.2rem; cursor: pointer;
            color: var(--steel-muted); font-size: 12px;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }
        .nav-item:hover {
            color: var(--steel-light);
            background: rgba(0,230,118,0.05);
            border-left-color: var(--rolex-gold);
        }
        .nav-item.active {
            color: #fff; border-left-color: var(--rolex-gold);
            background: linear-gradient(90deg, rgba(0,135,68,0.25) 0%, transparent 100%);
            font-weight: 600;
        }
        .nav-icon { font-size: 14px; width: 18px; text-align: center; }

        /* MAIN */
        .main {
            overflow-y: auto;
            padding: 1.5rem;
            background: transparent;
        }

        .dashboard-container { display: block; width: 100%; }

        .breadcrumb {
            display: flex; align-items: center; gap: 6px;
            font-size: 11px; color: var(--steel-muted);
            margin-bottom: 1.2rem;
        }
        .breadcrumb .active-crumb { color: var(--steel-light); font-weight: 600; }

        /* SELECTOR */
        .selector-panel {
            background: linear-gradient(145deg, var(--surface-card), var(--surface));
            border: 1px solid var(--border-glow);
            border-radius: 14px;
            padding: 1.4rem;
            margin-bottom: 1.2rem;
            box-shadow: 0 4px 25px rgba(0,0,0,0.4);
        }
        .selector-title {
            font-size: 11px; font-weight: 700;
            color: var(--rolex-gold);
            letter-spacing: 1px; text-transform: uppercase;
            font-family: 'Cinzel', serif;
            margin-bottom: 16px;
            display: flex; align-items: center; gap: 8px;
        }
        .selector-grid {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 16px;
            align-items: end;
        }
        .selector-field { display: flex; flex-direction: column; gap: 6px; }
        .selector-field label {
            font-size: 10px; font-weight: 700;
            color: var(--steel-muted);
            letter-spacing: 1px; text-transform: uppercase;
            font-family: 'Cinzel', serif;
        }
        .selector-field select {
            background: var(--abyssal);
            border: 1px solid var(--border-deep);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--steel-light);
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .selector-field select:hover,
        .selector-field select:focus {
            border-color: var(--rolex-gold);
            outline: none;
            box-shadow: 0 0 12px rgba(212,175,55,0.2);
        }
        .btn-generate {
            background: linear-gradient(135deg, var(--hulk), #006B34);
            color: #fff;
            border: 1px solid var(--rolex-gold);
            border-radius: 8px;
            padding: 10px 22px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-family: 'Cinzel', serif;
            transition: all 0.2s;
            white-space: nowrap;
            box-shadow: 0 0 15px rgba(0,135,68,0.3);
        }
        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,135,68,0.5);
        }

        /* ============================================================
           CHAT PANEL (NUEVO - debajo del selector)
           ============================================================ */
        .chat-panel {
            background: linear-gradient(145deg, var(--surface-card), var(--surface));
            border: 1px solid var(--border-glow);
            border-radius: 14px;
            margin-bottom: 1.2rem;
            box-shadow: 0 4px 25px rgba(0,0,0,0.4);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .chat-panel-header {
            background: linear-gradient(135deg, rgba(0,135,68,0.25), rgba(212,175,55,0.1));
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-deep);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chat-panel-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            font-weight: 700;
            color: var(--rolex-gold);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Cinzel', serif;
        }
        .chat-panel-title i {
            font-size: 16px;
            color: var(--hulk-vibrant);
        }
        .chat-panel-subtitle {
            font-size: 10px;
            color: var(--steel-muted);
            letter-spacing: 0.3px;
        }
        .chat-panel-body {
            padding: 16px 20px;
            background: rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 320px;
            min-height: 120px;
            overflow-y: auto;
        }
        .chat-msg {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chat-msg-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 12px;
            border: 1px solid var(--border-deep);
        }
        .chat-msg-user .chat-msg-avatar {
            background: rgba(41,182,246,0.15);
            color: var(--blue-accent);
            border-color: rgba(41,182,246,0.3);
        }
        .chat-msg-ai .chat-msg-avatar {
            background: rgba(0,230,118,0.15);
            color: var(--hulk-vibrant);
            border-color: rgba(0,230,118,0.3);
        }
        .chat-msg-content {
            flex: 1;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 12px;
            line-height: 1.6;
            color: var(--steel-silver);
            border-left: 3px solid transparent;
        }
        .chat-msg-user .chat-msg-content {
            border-left-color: var(--blue-accent);
            background: rgba(41,182,246,0.05);
        }
        .chat-msg-ai .chat-msg-content {
            border-left-color: var(--hulk-vibrant);
            background: rgba(0,230,118,0.05);
            white-space: pre-wrap;
        }
        .chat-msg-typing .chat-msg-content {
            border-left-color: var(--rolex-gold);
            background: rgba(212,175,55,0.05);
            font-style: italic;
            color: var(--steel-muted);
        }
        .chat-msg-label {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            font-family: 'Cinzel', serif;
        }
        .chat-msg-user .chat-msg-label { color: var(--blue-accent); }
        .chat-msg-ai .chat-msg-label { color: var(--hulk-vibrant); }
        .chat-msg-typing .chat-msg-label { color: var(--rolex-gold); }

        .chat-panel-footer {
            padding: 12px 20px;
            border-top: 1px solid var(--border-deep);
            background: var(--surface);
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .chat-input {
            flex: 1;
            background: var(--abyssal);
            border: 1px solid var(--border-deep);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--steel-light);
            font-family: 'Outfit', sans-serif;
            font-size: 12px;
            outline: none;
            transition: all 0.2s;
        }
        .chat-input:focus {
            border-color: var(--rolex-gold);
            box-shadow: 0 0 10px rgba(212,175,55,0.2);
        }
        .chat-input::placeholder { color: var(--steel-muted); }
        .chat-btn {
            background: linear-gradient(135deg, var(--hulk), #006B34);
            border: 1px solid var(--rolex-gold);
            border-radius: 8px;
            padding: 10px 16px;
            cursor: pointer;
            color: var(--rolex-gold-light);
            font-weight: 700;
            font-size: 12px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .chat-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(0,135,68,0.4);
        }
        .chat-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .chat-suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }
        .chat-suggestion {
            background: rgba(212,175,55,0.08);
            border: 1px solid rgba(212,175,55,0.25);
            border-radius: 14px;
            padding: 4px 12px;
            font-size: 10px;
            color: var(--rolex-gold);
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        .chat-suggestion:hover {
            background: rgba(212,175,55,0.15);
            transform: translateY(-1px);
        }

        /* MATRIZ 4 CUADRANTES */
        .matrix-layout {
            display: grid;
            grid-template-columns: 40px 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .matrix-y-axis {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .matrix-y-axis-label {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-size: 11px;
            font-weight: 700;
            color: var(--rolex-gold);
            font-family: 'Cinzel', serif;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .matrix-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 8px;
            aspect-ratio: 16/11;
            position: relative;
        }
        .quadrant {
            background: linear-gradient(145deg, var(--surface-card), var(--surface));
            border: 1px solid var(--border-deep);
            border-radius: 12px;
            padding: 14px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .quadrant::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--q-color, var(--rolex-gold));
            opacity: 0.7;
        }
        .quadrant:hover {
            border-color: var(--q-color, var(--rolex-gold));
            box-shadow: 0 6px 20px rgba(212,175,55,0.15);
        }
        .q-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-deep);
        }
        .q-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 700;
            font-family: 'Cinzel', serif;
            color: var(--q-color);
            letter-spacing: 0.5px;
        }
        .q-title i { font-size: 1.1rem; }
        .q-count {
            font-size: 10px;
            color: var(--steel-muted);
            padding: 2px 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            font-weight: 600;
        }
        .q-signs {
            position: absolute;
            top: 8px;
            right: 10px;
            font-size: 9px;
            color: var(--steel-muted);
            font-family: 'Courier New', monospace;
            opacity: 0.7;
        }
        .q-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-height: 140px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .tienda-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 9px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--q-color, var(--border-deep));
            border-radius: 14px;
            font-size: 10px;
            font-weight: 600;
            color: var(--steel-silver);
            cursor: pointer;
            transition: all 0.2s;
        }
        .tienda-chip:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-1px);
        }
        .tienda-chip i {
            font-size: 9px;
            color: var(--q-color);
        }
        .q-empty {
            font-size: 10px;
            color: var(--steel-muted);
            font-style: italic;
            padding: 8px 0;
        }

        .q-joya { --q-color: var(--hulk-vibrant); }
        .q-apuesta { --q-color: var(--rolex-gold); }
        .q-bunker { --q-color: var(--orange); }
        .q-lastre { --q-color: var(--red); }

        .matrix-x-axis {
            display: flex;
            justify-content: space-between;
            padding: 0 4px;
            margin-bottom: 20px;
            margin-left: 52px;
        }
        .matrix-x-axis-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--rolex-gold);
            font-family: 'Cinzel', serif;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .kpi-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed var(--border-deep);
        }
        .kpi-tag {
            font-size: 9px;
            padding: 2px 8px;
            border-radius: 8px;
            background: rgba(212,175,55,0.1);
            color: var(--rolex-gold);
            border: 1px solid rgba(212,175,55,0.3);
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        /* NARRATIVA IA */
        .narrative-box {
            background: linear-gradient(135deg, rgba(0, 135, 68, 0.12) 0%, rgba(15, 31, 26, 0.8) 100%);
            border: 1px solid var(--border-glow);
            border-left: 4px solid var(--rolex-gold);
            border-radius: 14px;
            padding: 1.2rem;
            box-shadow: 0 4px 25px rgba(0,0,0,0.4);
            margin-bottom: 1.2rem;
        }
        .narr-header {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 10px;
        }
        .narr-icon { font-size: 16px; }
        .narr-title {
            font-size: 11px; font-weight: 700;
            color: var(--rolex-gold);
            letter-spacing: 1px; text-transform: uppercase;
            font-family: 'Cinzel', serif;
        }
        .narr-text {
            font-size: 12px;
            color: var(--steel-silver);
            line-height: 1.7;
        }
        .narr-text strong { color: #fff; font-weight: 600; }
        .narr-recommendation {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border-deep);
        }
        .rec-card {
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 10px 12px;
            border-left: 3px solid var(--q-color, var(--rolex-gold));
        }
        .rec-card-title {
            font-size: 10px;
            font-weight: 700;
            color: var(--q-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            font-family: 'Cinzel', serif;
        }
        .rec-card-text {
            font-size: 11px;
            color: var(--steel-silver);
            line-height: 1.5;
        }

        /* DOS COLUMNAS */
        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 1.2rem;
        }
        .panel {
            background: linear-gradient(145deg, var(--surface-card), var(--surface));
            border: 1px solid var(--border-deep);
            border-radius: 14px;
            padding: 1.2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .panel-title {
            font-size: 11px; font-weight: 700;
            color: var(--rolex-gold);
            letter-spacing: 1px; text-transform: uppercase;
            margin-bottom: 14px;
            font-family: 'Cinzel', serif;
            display: flex; align-items: center; gap: 8px;
        }

        /* TABLA */
        .tabla-wrapper {
            overflow-x: auto;
            margin-top: 8px;
            width: 100%;
        }
        .matrix-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            min-width: 700px;
        }
        .matrix-table th,
        .matrix-table td {
            padding: 9px 10px;
            text-align: center;
            border: 1px solid var(--border-deep);
        }
        .matrix-table th {
            background: var(--surface);
            color: var(--rolex-gold);
            font-family: 'Cinzel', serif;
            letter-spacing: 0.5px;
            font-size: 10px;
        }
        .matrix-table td { color: var(--steel-silver); }
        .matrix-table .joya { background: rgba(0,230,118,0.12); color: var(--hulk-vibrant); font-weight: 700; }
        .matrix-table .apuesta { background: rgba(212,175,55,0.12); color: var(--rolex-gold); font-weight: 700; }
        .matrix-table .bunker { background: rgba(255,165,0,0.12); color: var(--orange); font-weight: 700; }
        .matrix-table .lastre { background: rgba(255,77,77,0.12); color: var(--red); font-weight: 700; }
        .matrix-table .sparkline-cell { width: 80px; padding: 4px 6px; }
        .matrix-table .tipo-cell { display: inline-flex; align-items: center; gap: 5px; }

        /* MAPA SVG */
        .map-container {
            background: var(--abyssal);
            border-radius: 12px;
            border: 1px solid var(--border-deep);
            padding: 8px;
            overflow: hidden;
        }
        .map-container svg { width: 100%; height: auto; display: block; }
        .map-legend {
            display: flex; gap: 16px; justify-content: center;
            flex-wrap: wrap; margin-top: 6px;
        }
        .map-legend-item {
            display: flex; align-items: center; gap: 6px;
            font-size: 9px; color: var(--steel-muted);
        }
        .map-legend-dot {
            width: 10px; height: 10px; border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .shell { grid-template-columns: 1fr; }
            .sidebar { display: none; }
            .main { padding: 1rem; }
            .selector-grid { grid-template-columns: 1fr; }

        const meses = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun'];

        ];

        function generarHistorico(t, meses) {
            const historico = [];
            const seed = t.nombre.length * 7 + t.salud * 3;
            let vS = t.salud - 0.6 + (seed % 5) * 0.1;
            let vR = t.resiliencia - 0.5 + (seed % 7) * 0.08;
            let vP = t.potencial - 0.4 + (seed % 6) * 0.09;
            let vE = t.exposicion - 0.3 + (seed % 8) * 0.07;
            for (let i = 0; i < meses.length; i++) {
                const trend = i / meses.length * 0.4;
                const noise = (Math.sin(i * 0.8 + seed) * 0.15) + (Math.random() * 0.1 - 0.05);
                vS = Math.max(0.5, Math.min(3.0, vS + 0.04 * trend + noise * 0.3));
                vR = Math.max(0.5, Math.min(3.0, vR + 0.03 * trend + noise * 0.25));
                vP = Math.max(0.5, Math.min(3.0, vP + 0.05 * trend + noise * 0.35));
                vE = Math.max(0.5, Math.min(3.0, vE + 0.02 * trend + noise * 0.2));
                historico.push({ mes: meses[i], salud: parseFloat(vS.toFixed(2)), resiliencia: parseFloat(vR.toFixed(2)), potencial: parseFloat(vP.toFixed(2)), exposicion: parseFloat(vE.toFixed(2)) });
            }
            return historico;
        }

        const tiendas = tiendasBase.map(t => {
            const historico = generarHistorico(t, meses);
            const ultimo = historico[historico.length - 1];
            return { ...t, historico, salud: ultimo.salud, resiliencia: ultimo.resiliencia, potencial: ultimo.potencial, exposicion: ultimo.exposicion };
        });

        function colorTipoHex(tipo) {

        }

        function calcularScorePorEscenario(tienda, escenarioId) {
            const kpis = KPIS_POR_ESCENARIO[escenarioId] || [];
            if (kpis.length === 0) return 1.5;
            const mapaKPI = {
                MB: tienda.salud * 0.9, VM2: tienda.salud, ROT: tienda.salud * 0.85, TKT: tienda.salud,
                UD: tienda.potencial, PEN: tienda.potencial * 0.9, CAP: tienda.potencial * 0.8,
                TRF: tienda.potencial * 0.95, CREC: tienda.potencial,
                MIX: tienda.resiliencia, COV: tienda.resiliencia * 0.9, CON: tienda.resiliencia,
                NPS: tienda.resiliencia * 0.95, FRQ: tienda.resiliencia, SKU: tienda.resiliencia * 0.85,
                DIF: tienda.exposicion, DIS: tienda.exposicion, ATR: tienda.exposicion,
                NSE: tienda.potencial * 0.9,
                TAL: tienda.resiliencia * 0.9, ENE: tienda.exposicion * 0.8,
                DIG: tienda.resiliencia * 0.85, LOG: tienda.resiliencia * 0.9
            };
            const valores = kpis.map(k => mapaKPI[k] || 1.5);
            const promedio = valores.reduce((a, b) => a + b, 0) / valores.length;
            const esNegativo = ['recesion', 'estanflacion', 'devaluacion', 'control_precios', 'walmart', 'hard_discount', 'habitos_inflacion', 'costos_logisticos', 'escasez_talento', 'crisis_energetica', 'ciberseguridad', 'cierre_fronteras', 'reformas_fiscales', 'inestabilidad', 'nacionalizacion'].includes(escenarioId);
            if (esNegativo) {
                return parseFloat(((promedio * 0.6) + (tienda.resiliencia * 0.4)).toFixed(2));
            }
            return parseFloat(promedio.toFixed(2));
        }

        function clasificarTienda(scoreX, scoreY) {
            const umbral = 2.0;
            if (scoreX >= umbral && scoreY >= umbral) return 'JOYA';
            if (scoreX >= umbral && scoreY < umbral) return 'APUESTA';
            if (scoreX < umbral && scoreY >= umbral) return 'BUNKER';
            return 'LASTRE';
        }

            html += '<thead><tr><th>Tienda</th><th>Ciudad</th><th>Score X</th><th>Score Y</th><th>Tipología</th></tr></thead>';
            html += '<tbody>';
            tiendasClasificadas.forEach(t => {
                const config = TIPOLOGIAS[t.tipoCalculado];
                html += '<tr class="' + t.tipoCalculado.toLowerCase() + '">';
                html += '<td style="font-weight:600;color:#fff;text-align:left;padding-left:12px;">' + t.nombre + '</td>';
                html += '<td style="color:var(--steel-muted);">' + t.ciudad + '</td>';
                html += '<td>' + t.scoreX.toFixed(2) + '</td>';
                html += '<td>' + t.scoreY.toFixed(2) + '</td>';
                html += '<td><span class="tipo-cell" style="color:' + config.color + ';">' + config.icono + ' ' + config.nombre + '</span></td>';
                html += '</tr>';
            });
            html += '</tbody></table></div>';
            html += '</div>';

            html += '<div class="panel">';
            html += '<div class="panel-title"><i class="fas fa-map-location-dot"></i> Ubicación Geográfica</div>';
            html += renderMapaSVG(tiendasClasificadas);
            html += '</div>';
            html += '</div>';

            html += '</div>';

            document.getElementById('mainContent').innerHTML = html;
        }

        function renderCuadrante(tipo, tiendas) {
            const config = TIPOLOGIAS[tipo];
            let html = '<div class="quadrant ' + config.cuadrante + '">';
            html += '<span class="q-signs">' + config.signos + '</span>';
            html += '<div class="q-header">';
            html += '<div class="q-title" style="color:' + config.color + ';">' + config.icono + ' ' + config.nombre + '</div>';
            html += '<span class="q-count">' + tiendas.length + ' tiendas</span>';
            html += '</div>';
            html += '<div class="q-chips">';
            if (tiendas.length === 0) {
                html += '<span class="q-empty">Sin tiendas en este cuadrante</span>';
            } else {
                tiendas.forEach(t => {
                    html += '<span class="tienda-chip"><i class="fas fa-store"></i> ' + t.nombre.replace('Plaza ', '') + '</span>';
                });
            }
            html += '</div>';
            html += '</div>';
            return html;
        }

        function renderRecCard(tipo, cantidad, texto) {
            const config = TIPOLOGIAS[tipo];
            return '<div class="rec-card" style="--q-color:' + config.color + ';">' +
                '<div class="rec-card-title">' + config.icono + ' ' + config.nombre + ' (' + cantidad + ')</div>' +
                '<div class="rec-card-text">' + texto + '</div>' +
                '</div>';
        }

        function renderMapaSVG(tiendas) {
            const lats = tiendas.map(t => t.lat);
            const lngs = tiendas.map(t => t.lng);
            const minLat = Math.min(...lats) - 0.3;
            const maxLat = Math.max(...lats) + 0.3;
            const minLng = Math.min(...lngs) - 0.3;
            const maxLng = Math.max(...lngs) + 0.3;
            const toX = (lng) => ((lng - minLng) / (maxLng - minLng)) * 360 + 20;
            const toY = (lat) => ((maxLat - lat) / (maxLat - minLat)) * 260 + 20;

            let bubbles = '';
            tiendas.forEach(t => {
                const cx = toX(t.lng);
                const cy = toY(t.lat);
                const r = 10 + (t.salud + t.resiliencia + t.potencial) / 3 * 6;
                const color = colorTipoHex(t.tipoCalculado);
                bubbles += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + color + '30" stroke="' + color + '" stroke-width="2"/>';
                bubbles += '<text x="' + cx + '" y="' + (cy + 2) + '" font-size="7" fill="#fff" font-weight="700" text-anchor="middle">' + t.nombre.split(' ').pop() + '</text>';
            });

            let grid = '';
            for (let i = 0; i < 3; i++) {
                grid += '<line x1="' + (20 + i * 120) + '" y1="20" x2="' + (20 + i * 120) + '" y2="280" stroke="rgba(212,175,55,0.06)" stroke-width="1"/>';
                grid += '<line x1="20" y1="' + (20 + i * 87) + '" x2="380" y2="' + (20 + i * 87) + '" stroke="rgba(212,175,55,0.06)" stroke-width="1"/>';
            }

            return '<div class="map-container"><svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg"><rect width="400" height="300" fill="rgba(11,22,18,0.6)" rx="8"/>' + grid + bubbles + '</svg>' +
                '<div class="map-legend">' +
                Object.entries(TIPOLOGIAS).map(([k, v]) => '<div class="map-legend-item"><div class="map-legend-dot" style="background:' + v.color + ';"></div>' + v.nombre + '</div>').join('') +
                '</div></div>';
        }

        // ============================================================
        // CHAT: Funciones
        // ============================================================
        function setChatInput(texto) {
            const input = document.getElementById('chatInput');
            if (input) {
                input.value = texto;
                input.focus();
            }
        }

        async function enviarConsultaChat() {
            const input = document.getElementById('chatInput');
            const btn = document.getElementById('chatBtn');
            const body = document.getElementById('chatPanelBody');
            if (!input || !body) return;

            const mensaje = input.value.trim();
            if (!mensaje) return;

            // Añadir mensaje del usuario
            const userMsg = document.createElement('div');
            userMsg.className = 'chat-msg chat-msg-user';
            userMsg.innerHTML = '<div class="chat-msg-avatar"><i class="fas fa-user"></i></div>' +
                '<div class="chat-msg-content"><div class="chat-msg-label">Tú</div>' + escapeHtml(mensaje) + '</div>';
            body.appendChild(userMsg);

            input.value = '';
            btn.disabled = true;
            body.scrollTop = body.scrollHeight;

            // Indicador de escritura
            const typingMsg = document.createElement('div');
            typingMsg.className = 'chat-msg chat-msg-typing';
            typingMsg.innerHTML = '<div class="chat-msg-avatar"><i class="fas fa-robot"></i></div>' +
                '<div class="chat-msg-content"><div class="chat-msg-label">Asistente</div>Pensando...</div>';
            body.appendChild(typingMsg);
            body.scrollTop = body.scrollHeight;

            // Contexto actual
            const contexto = 'Escenario X: ' + escenarioXActual + ' | Escenario Y: ' + escenarioYActual;

            try {
                const response = await fetch('/api/chat-deepseek', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: mensaje, contexto: contexto })
                });

                const data = await response.json();
                typingMsg.remove();

                const aiMsg = document.createElement('div');
                aiMsg.className = 'chat-msg chat-msg-ai';

                if (data.reply) {
                    aiMsg.innerHTML = '<div class="chat-msg-avatar"><i class="fas fa-robot"></i></div>' +
                        '<div class="chat-msg-content"><div class="chat-msg-label">Asistente DODET</div>' + escapeHtml(data.reply) + '</div>';
                } else {
                    aiMsg.innerHTML = '<div class="chat-msg-avatar"><i class="fas fa-robot"></i></div>' +
                        '<div class="chat-msg-content"><div class="chat-msg-label">Asistente DODET</div>Error: ' + escapeHtml(data.error || 'desconocido') + '</div>';
                }
                body.appendChild(aiMsg);
            } catch (error) {
                typingMsg.remove();
                const errMsg = document.createElement('div');
                errMsg.className = 'chat-msg chat-msg-typing';
                errMsg.innerHTML = '<div class="chat-msg-avatar"><i class="fas fa-robot"></i></div>' +
                    '<div class="chat-msg-content"><div class="chat-msg-label">Sistema</div>Error de conexión. Verifica tu internet.</div>';
                body.appendChild(errMsg);
            } finally {
                btn.disabled = false;
                body.scrollTop = body.scrollHeight;
                input.focus();
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        // INICIALIZACIÓN
        // ============================================================
        renderConstructor();
    </script>
</body>
